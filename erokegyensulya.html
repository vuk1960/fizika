<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Erők egyensúlya - Irány meghatározásával</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 500px; }
        .illustration { text-align: center; margin: 20px 0; background: #ffffff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-section { background: #eee; padding: 20px; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; }
        input { padding: 10px; width: 100px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .direction-toggle { display: flex; gap: 10px; }
        .dir-btn { padding: 8px 15px; border: 2px solid #1a237e; background: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .dir-btn.selected { background: #1a237e; color: white; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 10px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Erők egyensúlya</h1>
   
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (5 feladat)</button>
    </div>

    <div class="exercise-area">
        <div id="progress-text" style="font-weight:bold; color:#1a237e; margin-bottom:10px; display:none;"></div>
        <div id="illustration" class="illustration">
            <svg id="main-svg" width="700" height="250" viewBox="0 0 700 250"></svg>
        </div>

        <div class="input-section">
            <div>
                <span id="label-text" style="font-weight:bold">Érték</span>: 
                <input type="number" id="user-ans" step="0.1"> <span id="unit-text"></span>
            </div>
            <div class="direction-toggle">
                <span>Irány:</span>
                <button id="dir-up" class="dir-btn" onclick="selectDir('up')">Felfelé ↑</button>
                <button id="dir-down" class="dir-btn" onclick="selectDir('down')">Lefelé ↓</button>
            </div>
        </div>

        <div id="controls" style="margin-top: 20px; text-align:center;">
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" onclick="showSolution()">Súgó / Megoldás</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        <div id="solution-box" class="solution"></div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', examStep = 0, examPoints = 0, seconds = 0, timerInterval;
    let currentForces = [], targetValue = 0, targetUp = false, missingParam = '', solutionText = '';
    let selectedDir = null;
    const centerX = 350, centerY = 125, stepPx = 45;

    function selectDir(d) {
        selectedDir = d;
        document.getElementById('dir-up').className = 'dir-btn' + (d === 'up' ? ' selected' : '');
        document.getElementById('dir-down').className = 'dir-btn' + (d === 'down' ? ' selected' : '');
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        if(m === 'felel') startExam(); else stopExam();
    }

    function startExam() {
        examStep = 1; examPoints = 0; seconds = 0;
        document.getElementById('exam-timer').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        document.getElementById('grade-display').style.display = 'none';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
        generateTask();
    }

    function stopExam() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').style.display = 'none';
        document.getElementById('progress-text').style.display = 'none';
        generateTask();
    }

    function updateTimerDisplay() {
        let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
        document.getElementById('exam-timer').innerText = `${m}:${s}`;
    }

    function generateTask() {
        const svg = document.getElementById('main-svg');
        selectedDir = null;
        document.getElementById('dir-up').classList.remove('selected');
        document.getElementById('dir-down').classList.remove('selected');
        document.getElementById('feedback').innerText = "";
        document.getElementById('solution-box').style.display = "none";
        document.getElementById('user-ans').value = "";
        
        svg.innerHTML = `
            <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="red""")/>></marker></defs>
            <line x1="50" y1="${centerY}" x2="650" y2="${centerY}" stroke="#5d4037" stroke-width="6" stroke-linecap="round" />
            <polygon points="${centerX},${centerY} ${centerX-15},${centerY+30} ${centerX+15},${centerY+30}" fill="#1a237e" />
        `;

        if(appMode === 'felel') document.getElementById('progress-text').innerText = `Feladat: ${examStep} / 5`;

        const lCount = Math.floor(Math.random() * 2) + 1;
        const rCount = Math.floor(Math.random() * 2) + 1;
        currentForces = [];
        for(let i=0; i<lCount; i++) currentForces.push(createRandomForce(-1));
        for(let i=0; i<rCount; i++) currentForces.push(createRandomForce(1));

        let knownM = 0;
        solutionText = "<b>Részletes levezetés:</b><br>↺ Irány pozitív (+) | ↻ Irány negatív (-)<br>";

        for(let i=0; i<currentForces.length-1; i++) {
            let f = currentForces[i];
            let m = (f.side === -1) ? (f.up ? -f.val*f.dist : f.val*f.dist) : (f.up ? f.val*f.dist : -f.val*f.dist);
            knownM += m;
            solutionText += `• ${i+1}. erő: ${f.val}N, ${f.dist}m, ${f.up?'Fel':'Le'} -> M = ${m.toFixed(1)} Nm<br>`;
        }

        let last = currentForces[currentForces.length-1];
        // Kiszámoljuk, milyen nyomaték KELL az egyensúlyhoz:
        let neededM = -knownM;
        
        // Meghatározzuk az irányt: 
        // Ha a jobb oldalon (side:1) vagyunk és pozitív nyomaték kell -> FEL
        // Ha a jobb oldalon vagyunk és negatív nyomaték kell -> LE
        if(last.side === 1) {
            last.up = neededM > 0;
        } else {
            last.up = neededM < 0;
        }
        targetUp = last.up;

        if(Math.random() > 0.5) {
            last.val = Math.abs(neededM / last.dist);
            targetValue = last.val;
            missingParam = 'F';
            document.getElementById('label-text').innerText = "Hiányzó erő (F)";
            document.getElementById('unit-text').innerText = "N";
        } else {
            last.dist = Math.abs(neededM / last.val);
            targetValue = last.dist;
            missingParam = 'k';
            document.getElementById('label-text').innerText = "Hiányzó erőkar (k)";
            document.getElementById('unit-text').innerText = "m";
        }

        solutionText += `<br>Az ismeretlen erőnek <b>${neededM.toFixed(1)} Nm</b> nyomatékot kell kifejtenie.<br>`;
        solutionText += `Ehhez az erőnek <b>${targetUp ? 'FELFELÉ' : 'LEFELÉ'}</b> kell mutatnia.<br>`;
        solutionText += `Kiszámított érték: <b>${targetValue.toFixed(2)}</b>`;

        drawForces();
    }

    function createRandomForce(side) {
        let d;
        do { d = Math.floor(Math.random() * 6) + 1; } while(currentForces.some(f => f.side === side && f.dist === d));
        return { side, dist: d, val: (Math.floor(Math.random()*4)+2)*10, up: Math.random() > 0.5 };
    }

    function drawForces() {
        const svg = document.getElementById('main-svg');
        currentForces.forEach((f, idx) => {
            const isMissing = (idx === currentForces.length - 1);
            const x = centerX + (f.side * f.dist * stepPx);
            const yEnd = f.up ? centerY - 50 : centerY + 50;
            const color = isMissing ? "#d32f2f" : "#2196f3";
            
            if(isMissing) {
                // Ismeretlen erő: nincs fix nyílhegy, szaggatott vonal
                svg.innerHTML += `
                    <line x1="${x}" y1="${centerY-50}" x2="${x}" y2="${centerY+50}" stroke="${color}" stroke-width="2" stroke-dasharray="4" />
                    <text x="${x-5}" y="${centerY-60}" font-weight="bold" fill="${color}" style="font-size:20px">?</text>
                    <text x="${x+10}" y="${centerY+15}" font-weight="bold" fill="${color}">${missingParam==='F'?'?':f.val+'N'}</text>
                    <text x="${x-15}" y="${centerY-10}" style="font-size:12px; fill:#333; font-weight:bold">${missingParam==='k'?'?':f.dist+'m'}</text>
                `;
            } else {
                svg.innerHTML += `
                    <line x1="${x}" y1="${centerY}" x2="${x}" y2="${yEnd}" stroke="${color}" stroke-width="4" marker-end="url(#arr)" />
                    <text x="${x+8}" y="${yEnd+(f.up?-5:15)}" font-weight="bold" fill="${color}">${f.val}N</text>
                    <text x="${x-10}" y="${centerY-12}" style="font-size:11px; fill:#333; font-weight:bold">${f.dist}m</text>
                `;
            }
        });
    }

    function checkAnswer() {
        const userVal = parseFloat(document.getElementById('user-ans').value);
        const fb = document.getElementById('feedback');
        
        if(isNaN(userVal) || !selectedDir) {
            fb.innerText = "Kérlek, add meg az értéket ÉS az irányt is!";
            fb.style.color = "orange";
            return;
        }

        const dirCorrect = (selectedDir === 'up' && targetUp) || (selectedDir === 'down' && !targetUp);
        const valCorrect = Math.abs(userVal - targetValue) < 0.15;

        if(dirCorrect && valCorrect) {
            fb.innerText = "✓ Tökéletes! Az érték és az irány is jó."; fb.style.color = "green";
            if(appMode === 'felel') examPoints += 20;
        } else if (!dirCorrect && valCorrect) {
            fb.innerText = "⚠ Az érték jó, de az IRÁNY hibás!"; fb.style.color = "red";
        } else {
            fb.innerText = "✘ Sajnos nem jó. Nézd meg a segítséget!"; fb.style.color = "red";
        }

        if(appMode === 'felel') {
            examStep++;
            if(examStep > 5) finishExam(); else setTimeout(generateTask, 2000);
        }
    }

    function showSolution() {
        document.getElementById('solution-box').style.display = "block";
        document.getElementById('solution-box').innerHTML = solutionText;
    }

    function finishExam() {
        clearInterval(timerInterval);
        const gradeBox = document.getElementById('grade-display');
        gradeBox.style.display = "block";
        let grade = examPoints >= 90 ? 5 : examPoints >= 75 ? 4 : examPoints >= 60 ? 3 : examPoints >= 40 ? 2 : 1;
        gradeBox.innerHTML = `<h2>Eredmény</h2><p>Pontszám: ${examPoints} / 100</p><h3>Jegy: ${grade}</h3><button class="action-btn" onclick="setMode('gyak')">Újrakezdés</button>`;
    }

    generateTask();
</script>
</body>
</html>
