<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Erők egyensúlya - Javított</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .exercise-area { border: 2px solid #e1e4e8; padding: 20px; border-radius: 10px; background: #fafafa; }
        .illustration { text-align: center; margin: 20px 0; background: white; padding: 10px; border: 1px dotted #ccc; }
        .input-section { background: #eee; padding: 15px; border-radius: 10px; text-align: center; border: 2px solid #1a237e; }
        input { padding: 8px; width: 80px; border: 2px solid #ccc; border-radius: 5px; font-size: 1.1em; }
        .dir-btn { padding: 8px 15px; border: 2px solid #1a237e; background: white; cursor: pointer; border-radius: 5px; font-weight: bold; margin: 0 5px; }
        .dir-btn.selected { background: #1a237e; color: white; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; margin: 5px; }
        .grade-box { display: none; text-align: center; padding: 20px; border: 5px double #1a237e; background: #f0f0f0; margin-top: 20px; }
        @media print { body * { visibility: hidden; } #grade-display, #grade-display * { visibility: visible; } #grade-display { position: absolute; left:0; top:0; width:100%; } }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; color: #1a237e;">Erők egyensúlya</h1>
    
    <div id="mode-selector" style="text-align:center; margin-bottom:20px;">
        <button class="action-btn" id="btn-gyak" onclick="setMode('gyak')" style="background:#1a237e">Gyakorlás</button>
        <button class="action-btn" id="btn-felel" onclick="setMode('felel')" style="background:#546e7a">Felelés (5 feladat)</button>
    </div>

    <div class="exercise-area" id="main-area">
        <div id="progress-text" style="font-weight:bold; margin-bottom:10px;"></div>
        <div id="exam-timer" style="color:red; font-weight:bold; text-align:right;"></div>
        
        <div class="illustration">
            <svg id="main-svg" width="600" height="150"></svg>
        </div>

        <div class="input-section">
            <span id="label-text">F2 értéke</span>: <input type="number" id="user-ans"> N
            <div style="margin-top:10px;">
                <button id="dir-up" class="dir-btn" onclick="selectDir('up')">Fel ↑</button>
                <button id="dir-down" class="dir-btn" onclick="selectDir('down')">Le ↓</button>
            </div>
        </div>

        <div style="text-align:center; margin-top:15px;">
            <button class="action-btn" onclick="checkAnswer()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" onclick="showSolution()">Súgó</button>
        </div>
        <div id="feedback" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
    </div>
    
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', examStep = 0, examPoints = 0, seconds = 0, timerInterval;
    let targetVal = 0, targetUp = true, solSeen = false, selDir = null;

    window.onload = function() { generateTask(); };

    function selectDir(d) {
        selDir = d;
        document.getElementById('dir-up').className = 'dir-btn' + (d === 'up' ? ' selected' : '');
        document.getElementById('dir-down').className = 'dir-btn' + (d === 'down' ? ' selected' : '');
    }

    function setMode(m) {
        appMode = m;
        if(m === 'felel') startExam(); else stopExam();
    }

    function startExam() {
        examStep = 1; examPoints = 0; seconds = 0;
        document.getElementById('grade-display').style.display = 'none';
        document.getElementById('main-area').style.display = 'block';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('exam-timer').innerText = Math.floor(seconds/60) + ":" + (seconds%60).toString().padStart(2,'0');
        }, 1000);
        generateTask();
    }

    function stopExam() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').innerText = "";
        document.getElementById('progress-text').innerText = "";
        generateTask();
    }

    function generateTask() {
        solSeen = false; selDir = null;
        document.getElementById('dir-up').classList.remove('selected');
        document.getElementById('dir-down').classList.remove('selected');
        document.getElementById('feedback').innerText = "";
        document.getElementById('user-ans').value = "";
        if(appMode === 'felel') document.getElementById('progress-text').innerText = "Feladat: " + examStep + " / 5";

        let f1 = Math.floor(Math.random() * 50) + 10;
        let k1 = Math.floor(Math.random() * 4) + 1;
        let k2 = Math.floor(Math.random() * 4) + 1;
        targetVal = (f1 * k1) / k2;
        targetUp = true; // Ebben a példában mindig fel

        const svg = document.getElementById('main-svg');
        svg.innerHTML = `
            <line x1="50" y1="80" x2="550" y2="80" stroke="black" stroke-width="4"/>
            <polygon points="300,80 285,110 315,110" fill="blue"/>
            <text x="${300 - k1*50}" y="60" fill="red" text-anchor="middle">F1 = ${f1}N (k1=${k1}m)</text>
            <text x="${300 + k2*50}" y="60" fill="blue" text-anchor="middle">F2 = ? (k2=${k2}m)</text>
        `;
    }

    function showSolution() {
        if(appMode === 'felel') { solSeen = true; alert("Súgóval nem jár pont!"); }
        alert("Megoldás: " + targetVal.toFixed(1) + " N, Irány: Fel");
    }

    function checkAnswer() {
        let uVal = parseFloat(document.getElementById('user-ans').value);
        let isCorrect = Math.abs(uVal - targetVal) < 0.2 && selDir === 'up';

        if(isCorrect) {
            if(appMode === 'felel') {
                if(!solSeen) examPoints += 20;
                if(examStep < 5) { examStep++; generateTask(); } else finishExam("Erők egyensúlya");
            } else { document.getElementById('feedback').innerText = "Helyes!"; }
        } else {
            document.getElementById('feedback').innerText = "Hibás!";
            if(appMode === 'felel') {
                if(examStep < 5) { examStep++; generateTask(); } else finishExam("Erők egyensúlya");
            }
        }
    }

    function finishExam(temakor) {
        clearInterval(timerInterval);
        const g = document.getElementById('grade-display');
        g.style.display = "block";
        document.getElementById('main-area').style.display = "none";
        let j = examPoints >= 90 ? 5 : examPoints >= 70 ? 4 : examPoints >= 50 ? 3 : examPoints >= 30 ? 2 : 1;
        let nev = prompt("Add meg a neved:") || "Tanuló";
        let hash = 0, nyers = nev + j + temakor + "suli2024";
        for (let i = 0; i < nyers.length; i++) hash = ((hash << 5) - hash) + nyers.charCodeAt(i);
        let azonosito = "BIZ-" + Math.abs(hash | 0).toString(16).toUpperCase();
        
        g.innerHTML = `<h1>BIZONYÍTVÁNY</h1><h2>${nev}</h2><p>${temakor}</p><div style="font-size:3em;">${j}</div><p>Pont: ${examPoints}/100</p><p style="font-size:0.7em;">Kód: ${azonosito}</p><button class="action-btn" onclick="window.print()">Mentés PDF</button><button class="action-btn" onclick="location.reload()">Újra</button>`;
    }
</script>
</body>
</html>
