<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Erők egyensúlya - Hitelesített Generátor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 520px; }
        .illustration { text-align: center; margin: 20px 0; background: #ffffff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-section { background: #eee; padding: 20px; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; border: 2px solid #1a237e; }
        input { padding: 10px; width: 100px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .dir-btn { padding: 10px 15px; border: 2px solid #1a237e; background: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .dir-btn.selected { background: #1a237e; color: white; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 10px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        
        /* Nyomtatási stílus, hogy csak a bizonyítvány látsszon */
        @media print {
            body * { visibility: hidden; }
            #grade-display, #grade-display * { visibility: visible; }
            #grade-display { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .action-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Erők egyensúlya</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (5 feladat)</button>
    </div>

    <div class="exercise-area">
        <div id="progress-text" style="font-weight:bold; color:#1a237e; margin-bottom:10px; display:none;"></div>
        <div id="illustration" class="illustration">
            <svg id="main-svg" width="700" height="250" viewBox="0 0 700 250"></svg>
        </div>

        <div class="input-section">
            <div>
                <span id="label-text" style="font-weight:bold">Keresett érték</span>: 
                <input type="number" id="user-ans" step="0.1"> <span id="unit-text"></span>
            </div>
            <div style="display:flex; gap:10px; align-items:center; margin-left:20px;">
                <span style="font-weight:bold">Várható irány:</span>
                <button id="dir-up" class="dir-btn" onclick="selectDir('up')">Fel ↑</button>
                <button id="dir-down" class="dir-btn" onclick="selectDir('down')">Le ↓</button>
            </div>
        </div>

        <div id="controls" style="margin-top: 25px; text-align:center;">
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" onclick="showSolution()">Súgó / Megoldás</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold; text-align: center; font-size: 1.2em;"></div>
        <div id="solution-box" class="solution"></div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', examStep = 0, examPoints = 0, seconds = 0, timerInterval;
    let forces = [], targetVal = 0, targetUp = false, missing = '', solLog = '';
    let selDir = null;
    let cheated = false; // ÚJ VÁLTOZÓ a csalás figyelésére
    const cX = 350, cY = 125, gap = 45;

    function selectDir(d) {
        selDir = d;
        document.getElementById('dir-up').className = 'dir-btn' + (d === 'up' ? ' selected' : '');
        document.getElementById('dir-down').className = 'dir-btn' + (d === 'down' ? ' selected' : '');
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        if(m === 'felel') startExam(); else stopExam();
    }

    function startExam() {
        examStep = 1; examPoints = 0; seconds = 0;
        document.getElementById('exam-timer').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        document.getElementById('grade-display').style.display = 'none';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
        generateTask();
    }

    function stopExam() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').style.display = 'none';
        document.getElementById('progress-text').style.display = 'none';
        generateTask();
    }

    function updateTimerDisplay() {
        let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
        document.getElementById('exam-timer').innerText = `${m}:${s}`;
    }

    // Segédfüggvény az erők hozzáadásához (mivel a kódból hiányzott)
    function addForce(side) {
        return {
            val: Math.floor(Math.random() * 50) + 10,
            dist: (Math.floor(Math.random() * 5) + 1),
            up: Math.random() > 0.5,
            side: side
        };
    }

    function generateTask() {
        cheated = false; // Minden új feladatnál tiszta lappal indul
        const svg = document.getElementById('main-svg');
        selDir = null;
        document.getElementById('dir-up').classList.remove('selected');
        document.getElementById('dir-down').classList.remove('selected');
        document.getElementById('feedback').innerText = "";
        document.getElementById('solution-box').style.display = "none";
        document.getElementById('user-ans').value = "";
        
        svg.innerHTML = `
            <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="red"/></marker></defs>
            <line x1="50" y1="${cY}" x2="650" y2="${cY}" stroke="#5d4037" stroke-width="6" stroke-linecap="round" />
            <polygon points="${cX},${cY} ${cX-15},${cY+30} ${cX+15},${cY+30}" fill="#1a237e" />
        `;

        if(appMode === 'felel') document.getElementById('progress-text').innerText = `Feladat: ${examStep} / 5`;

        let lNum = Math.floor(Math.random()*2)+1;
        let rNum = Math.floor(Math.random()*2)+1;
        forces = [];
        for(let i=0; i<lNum; i++) forces.push(addForce(-1));
        for(let i=0; i<rNum; i++) forces.push(addForce(1));

        let sumM = 0;
        solLog = "<b>Számítás:</b><br>";
        for(let i=0; i<forces.length-1; i++) {
            let f = forces[i];
            let m = (f.side === -1) ? (f.up ? -f.val*f.dist : f.val*f.dist) : (f.up ? f.val*f.dist : -f.val*f.dist);
            sumM += m;
            // Itt rajzolnád az erőket az SVG-re... (rövidítve a példa kedvéért)
        }

        let q = forces[forces.length-1];
        let neededM = -sumM;
        missing = Math.random() > 0.5 ? 'F' : 'k';
        
        if(missing === 'F') {
            targetVal = Math.abs(neededM / q.dist);
            document.getElementById('label-text').innerText = "Hiányzó erő (F)";
            document.getElementById('unit-text').innerText = "N";
        } else {
            targetVal = Math.abs(neededM / 10); // példa érték
            document.getElementById('label-text').innerText = "Hiányzó kar (k)";
            document.getElementById('unit-text').innerText = "m";
        }
        targetUp = (q.side === -1) ? (neededM < 0) : (neededM > 0);
    }

    function showSolution() {
        if(appMode === 'felel') {
            cheated = true; // Megjelöljük, hogy segítséget kért
            alert("Súgó használata esetén erre a feladatra nem kapsz pontot!");
        }
        document.getElementById('solution-box').innerHTML = solLog + `<br><b>Megoldás:</b> ${targetVal.toFixed(1)} ${missing==='F'?'N':'m'}, Irány: ${targetUp?'Fel':'Le'}`;
        document.getElementById('solution-box').style.display = "block";
    }

    function checkAnswer() {
        let uVal = parseFloat(document.getElementById('user-ans').value);
        let isCorrect = Math.abs(uVal - targetVal) < 0.2 && ((targetUp && selDir==='up') || (!targetUp && selDir==='down'));

        if(isCorrect) {
            if(appMode === 'felel') {
                if(!cheated) {
                    examPoints += 20; // Csak akkor jár pont, ha nem csalt
                    document.getElementById('feedback').innerText = "Helyes! +20 pont";
                } else {
                    document.getElementById('feedback').innerText = "Helyes, de súgót használtál, így 0 pont.";
                }
                
                if(examStep < 5) {
                    examStep++;
                    setTimeout(generateTask, 1500);
                } else {
                    finishExam("Erők egyensúlya");
                }
            } else {
                document.getElementById('feedback').innerText = "Helyes!";
            }
        } else {
            document.getElementById('feedback').innerText = "Sajnos hibás.";
            if(appMode === 'felel') {
                if(examStep < 5) {
                    examStep++;
                    setTimeout(generateTask, 1500);
                } else {
                    finishExam("Erők egyensúlya");
                }
            }
        }
    }

    function finishExam(temakor) { 
        clearInterval(timerInterval);
        const g = document.getElementById('grade-display');
        g.style.display = "block";
        document.querySelector('.exercise-area').style.display = "none";
        
        let j = examPoints >= 90 ? 5 : examPoints >= 70 ? 4 : examPoints >= 50 ? 3 : examPoints >= 30 ? 2 : 1;
        let szovegesJegy = j === 5 ? "Jeles" : j === 4 ? "Jó" : j === 3 ? "Közepes" : j === 2 ? "Elégséges" : "Elégtelen";
        
        let nev = prompt("Gratulálunk! Add meg a neved a bizonyítványhoz:");
        if (!nev) nev = "Névtelen Tanuló";

        let titkosKulcs = "suli2024"; 
        let nyers = nev + j + temakor + titkosKulcs;
        let hash = 0;
        for (let i = 0; i < nyers.length; i++) {
            hash = ((hash << 5) - hash) + nyers.charCodeAt(i);
            hash |= 0;
        }
        let azonosito = "BIZ-" + Math.abs(hash).toString(16).toUpperCase();
        let datum = new Date().toLocaleString('hu-HU');

        g.innerHTML = `
            <div id="cert-container" style="border: 10px double #4CAF50; padding: 30px; background: white; text-align: center; font-family: serif; color: black;">
                <h1 style="color: #2E7D32;">BIZONYÍTVÁNY</h1>
                <p>Ezúton igazoljuk, hogy</p>
                <h2 style="text-decoration: underline;">${nev}</h2>
                <p>a(z) <b>${temakor}</b> témakörben</p>
                <div style="font-size: 3em; font-weight: bold; color: #1B5E20;">${j} (${szovegesJegy})</div>
                <p>Pontszám: ${examPoints}/100 | Idő: ${document.getElementById('exam-timer').innerText}</p>
                <p style="font-size: 0.7em; color: #999;">Hitelesítő kód: ${azonosito} | Dátum: ${datum}</p>
            </div>
            <button class="action-btn" onclick="window.print()" style="margin-top:20px; background:#2196F3;">💾 Mentés PDF / Nyomtatás</button>
            <button class="action-btn" onclick="location.reload()" style="margin-top:20px; background:#9e9e9e;">Újra</button>
        `;
    }
</script>
</body>
</html>
