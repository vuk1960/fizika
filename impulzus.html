<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika Mester - Impulzusmegmaradás Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #2196f3; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 350px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin: 20px 0; }
        .input-group { background: #cfd8dc; padding: 15px; border-radius: 8px; border: 1px solid #b0bec5; }
        input { padding: 8px; width: 100px; border: 2px solid #ccc; border-radius: 6px; font-weight: bold; font-size: 1.1em; }
        .given { background: #4caf50; color: white; padding: 5px 12px; border-radius: 4px; font-weight: bold; }
        .action-btn { background: #1a237e; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 20px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.8; font-family: 'Courier New', monospace; white-space: pre-wrap; }
        .result-screen { display: none; text-align: center; padding: 40px; background: #e8eaf6; border: 4px solid #1a237e; border-radius: 20px; }
        .theory-section { background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #2196f3; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color: #1a237e; text-align: center;">Impulzusmegmaradás</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza az index oldalra</a></h1>

    <div class="mode-selector">
        <button id="m-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="m-exam" class="mode-btn" onclick="setMode('exam')">Vizsga (5 feladat)</button>
    </div>

    <div id="theory" class="theory-section">
        <b>Elmélet:</b> Rugalmatlan ütközésnél a testek összetapadnak ($m_1v_1 + m_2v_2 = (m_1+m_2)u$). Szétlökődésnél a kezdő impulzus nulla ($0 = m_1v_1' + m_2v_2'$). Figyelj az irányokra: a szembe jövő vagy hátrafelé mozgó test sebessége <b>negatív</b>!
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-inel" onclick="switchCat('inel')">Rugalmatlan</button>
        <button class="nav-btn" id="btn-elas" onclick="switchCat('elas')">Rugalmas (m1=m2)</button>
        <button class="nav-btn" id="btn-expl" onclick="switchCat('expl')">Robbanás</button>
        <button class="nav-btn" id="btn-jump" onclick="switchCat('jump')">Leugrás kocsiról</button>
    </div>

    <div class="exercise-area" id="main-area">
        <h2 id="task-title">Feladat</h2>
        <p id="task-desc" style="font-size: 1.2em; padding: 15px; background: #fff; border: 1px solid #2196f3; border-radius: 8px; color: #1a237e;"></p>
        
        <div class="input-grid" id="input-fields"></div>

        <div id="controls">
            <button class="action-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button id="new-btn" class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#ff9800" onclick="showDetailedHelp()">Lépésenkénti levezetés</button>
        </div>

        <div id="feedback" style="margin-top:15px; font-weight: bold; font-size: 1.2em;"></div>
        <div id="solution-box" class="solution"></div>
    </div>

    <div id="result-screen" class="result-screen"></div>
</div>

<script>
    let mode = 'gyak', currentCat = 'inel', taskCount = 0, examScores = [];
    let currentTask = {}, statWrongTries = 0, statSolSeen = 0, statNewTask = 0, helpUsed = false;

    const labels = {
        m1: "1. test tömege (kg)", v1: "1. test sebessége (m/s)",
        m2: "2. test tömege (kg)", v2: "2. test sebessége (m/s)",
        u: "Közös sebesség (m/s)", v1p: "1. test sebessége utána (m/s)",
        v2p: "2. test sebessége utána (m/s)", me: "Ember tömege (kg)",
        mk: "Kocsi tömege (kg)", vk: "Kocsi sebessége előtte (m/s)"
    };

    function setMode(m) {
        mode = m;
        document.getElementById('m-gyak').classList.toggle('active', m === 'gyak');
        document.getElementById('m-exam').classList.toggle('active', m === 'exam');
        document.getElementById('new-btn').style.display = (m === 'exam' ? 'none' : 'inline-block');
        resetStats();
        generateTask();
    }

    function resetStats() {
        taskCount = 0; examScores = []; statWrongTries = 0; statSolSeen = 0; statNewTask = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-area').style.display = 'block';
    }

    function switchCat(cat) {
        currentCat = cat;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + cat).classList.add('active');
        generateTask();
    }

    function generateTask() {
        statNewTask++; helpUsed = false;
        document.getElementById('feedback').innerText = '';
        document.getElementById('solution-box').style.display = 'none';
        
        let m1, m2, v1, v2, v1p, v2p, u, keys, desc, help;

        if (currentCat === 'inel') {
            m1 = r(2, 10); m2 = r(2, 15); v1 = r(3, 10); v2 = Math.random() > 0.5 ? -r(2, 6) : 0;
            u = (m1 * v1 + m2 * v2) / (m1 + m2);
            keys = ['m1', 'v1', 'm2', 'v2', 'u'];
            desc = `Egy ${m1} kg-os test ${v1} m/s-os sebességgel halad. ${v2 === 0 ? 'Nekiütközik egy álló' : 'Szembe jön vele egy'} ${m2} kg-os test (${v2} m/s). Az ütközés rugalmatlan.`;
            help = `1. Képlet: m1·v1 + m2·v2 = (m1+m2)·u\n2. Behelyettesítés: ${m1}·${v1} + ${m2}·(${v2}) = (${m1}+${m2})·u\n3. Összevonás: ${m1*v1 + m2*v2} = ${m1+m2}·u\n4. Eredmény: u = ${u.toFixed(2)} m/s`;
            currentTask = { vals: {m1, v1, m2, v2, u}, given: keys.sort(()=>.5-Math.random()).slice(0,4), desc, help };
        } 
        else if (currentCat === 'expl') {
            m1 = r(2, 5); m2 = r(6, 12); v1p = r(4, 10); v2p = -(m1 * v1p) / m2;
            keys = ['m1', 'm2', 'v1p', 'v2p'];
            desc = `Két, kezdetben álló kiskocsi közé szorított rugó szétlöki a testeket. Az ${m1} kg-os kocsi ${v1p} m/s sebességgel indul el jobbra. Mennyi a másik kocsi sebessége?`;
            help = `1. Képlet: 0 = m1·v1' + m2·v2'\n2. Behelyettesítés: 0 = ${m1}·${v1p} + ${m2}·v2'\n3. Átrendezés: ${-m1*v1p} = ${m2}·v2'\n4. Eredmény: v2' = ${v2p.toFixed(2)} m/s`;
            currentTask = { vals: {m1, m2, v1p, v2p}, given: keys.sort(()=>.5-Math.random()).slice(0,3), desc, help };
        }
        else if (currentCat === 'jump') {
            let me = 60, mk = 140, vk = r(2, 5), vep = r(6, 10);
            let vkp = ((me+mk)*vk - me*vep)/mk;
            keys = ['me', 'mk', 'vk', 'vep', 'vkp'];
            desc = `Egy ${me} kg-os ember egy ${mk} kg-os kocsival halad közösen ${vk} m/s-al. Az ember leugrik előre ${vep} m/s sebességgel (a talajhoz képest). Mennyi a kocsi új sebessége?`;
            help = `1. Képlet: (me+mk)·vk = me·vep + mk·vkp\n2. Behelyettesítés: (${me}+${mk})·${vk} = ${me}·${vep} + ${mk}·vkp\n3. Összevonás: ${(me+mk)*vk} = ${me*vep} + ${mk}·vkp\n4. Eredmény: vkp = ${vkp.toFixed(2)} m/s`;
            currentTask = { vals: {me, mk, vk, vep, vkp}, given: keys.sort(()=>.5-Math.random()).slice(0,4), desc, help };
        }
        else { // Elas
            m1 = r(2,10); v1 = r(5,10); v2 = 0;
            currentTask = { vals: {m1, m2:m1, v1, v2, v1p:0, v2p:v1}, given: ['m1','v1'], 
                desc: `Rugalmas ütközés: két azonos (${m1} kg) tömegű golyó ütközik. Az egyik ${v1} m/s-al halad, a másik áll.`,
                help: `Azonos tömegű rugalmas ütközésnél a testek sebességet cserélnek!\nv1' = v2 = 0\nv2' = v1 = ${v1}` };
        }
        renderFields();
    }

    function r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function renderFields() {
        const container = document.getElementById('input-fields');
        container.innerHTML = '';
        document.getElementById('task-desc').innerHTML = currentTask.desc;
        Object.keys(currentTask.vals).forEach(k => {
            let isGiven = currentTask.given.includes(k);
            container.innerHTML += `<div class="input-group"><label><b>${labels[k] || k}:</b></label><br>
                ${isGiven ? `<span class="given">${currentTask.vals[k].toFixed(1)}</span>` : `<input type="number" step="0.1" id="in-${k}">`}</div>`;
        });
    }

    function showDetailedHelp() {
        statSolSeen++; helpUsed = true;
        const box = document.getElementById('solution-box');
        box.innerHTML = "<b>Lépésenkénti megoldás:</b><br>" + currentTask.help.replace(/\n/g, '<br>');
        box.style.display = 'block';
    }

    function checkAnswers() {
        let ok = true;
        Object.keys(currentTask.vals).forEach(k => {
            if (!currentTask.given.includes(k)) {
                let val = parseFloat(document.getElementById(`in-${k}`).value);
                if (isNaN(val) || Math.abs(val - currentTask.vals[k]) > 0.2) ok = false;
            }
        });

        const fb = document.getElementById('feedback');
        if (ok) {
            fb.innerHTML = "✅ Kiváló megoldás!"; fb.style.color = "green";
            if (mode === 'exam') {
                examScores.push(helpUsed ? 0.5 : 1);
                taskCount++;
                if (taskCount < 5) setTimeout(generateTask, 1000); else showFinal();
            }
        } else {
            statWrongTries++;
            fb.innerHTML = "❌ Hiba a számításban!"; fb.style.color = "red";
        }
    }

    function saveJPG() {
        let total = examScores.reduce((a,b)=>a+b, 0);
        let grade = total >= 4.5 ? 5 : total >= 3.5 ? 4 : total >= 2.5 ? 3 : 2;
        const c = document.createElement('canvas'); const ctx = c.getContext('2d');
        c.width = 600; c.height = 500;
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,600,500);
        ctx.strokeStyle = '#1a237e'; ctx.lineWidth = 10; ctx.strokeRect(5,5,590,490);
        ctx.fillStyle = '#1a237e'; ctx.textAlign = 'center'; ctx.font = 'bold 30px Arial'; ctx.fillText('BIZONYÍTVÁNY', 300, 70);
        ctx.font = '20px Arial'; ctx.fillText('Impulzusmegmaradás Vizsga', 300, 120);
        ctx.textAlign = 'left'; ctx.font = '16px Arial'; ctx.fillStyle = '#333';
        ctx.fillText(`- Plusz feladatok: ${statNewTask - (mode==='exam'?5:0)}`, 150, 200);
        ctx.fillText(`- Súgó használat: ${statSolSeen} alkalommal`, 150, 240);
        ctx.fillText(`- Hibás válaszok: ${statWrongTries}`, 150, 280);
        ctx.textAlign = 'center'; ctx.font = 'bold 80px Arial'; ctx.fillText(`JEGY: ${grade}`, 300, 420);
        const l = document.createElement('a'); l.download = 'impulzus_vizsga.jpg'; l.href = c.toDataURL('image/jpeg'); l.click();
    }

    function showFinal() {
        document.getElementById('main-area').style.display = 'none';
        const res = document.getElementById('result-screen');
        res.style.display = 'block';
        let total = examScores.reduce((a,b)=>a+b, 0);
        res.innerHTML = `<h2>Vizsga vége!</h2><h1 style="font-size:4em;">Pontszám: ${total}/5</h1>
            <p>Súgóhasználat: ${statSolSeen} | Hibák: ${statWrongTries}</p>
            <button class="action-btn" onclick="saveJPG()">Eredmény mentése (JPG)</button>
            <button class="action-btn" style="background:#f44336" onclick="location.reload()">Új vizsga</button>`;
    }

    generateTask();
</script>
</body>
</html>
