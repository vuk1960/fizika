<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pápai Református Kollégium - AI Asszisztens</title>
<style>
body{
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    margin:0;
    background:#f4f6f9;
    color:#333;
}
header{
    background:#002d62;
    color:white;
    padding:20px 40px;
}
.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}
input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:2px solid #ddd;
    border-radius:6px;
    margin-bottom:15px;
    font-size:16px;
}
button{
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px;
    cursor:pointer;
    width:100%;
    font-size:16px;
    font-weight:bold;
}
button:hover{
    background:#004499;
}
#valasz{
    margin-top:20px;
    padding:20px;
    background:#f7fafc;
    border-left:4px solid #002d62;
    display:none;
    white-space:pre-wrap;
    line-height: 1.6;
}
.loading { color: #666; font-style: italic; }
</style>
</head>
<body>

<header>
    <h1>Pápai Református Kollégium</h1>
    <p>Iskolai AI Asszisztens</p>
</header>
<h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
<div class="container">

<h2>Kérdezz az iskolai dokumentumok alapján!</h2>
<p>Az asszisztens átfésüli a csatolt Házirend, SZMSZ és Menzadíj dokumentumokat, majd helyben legenerálja a választ.</p>

<input
    id="kerdes"
    type="text"
    placeholder="Például: Mikor kezdődik a nulladik óra? Vagy: Mennyi a menzadíj?"
>

<button onclick="kerdezes()">
Kérdés elküldése
</button>

<div id="valasz"></div>

</div>

<script>
async function kerdezes(){
    const kerdesInput = document.getElementById("kerdes");
    const userQuestion = kerdesInput.value.trim().toLowerCase();

    if(!userQuestion){
        alert("Írj be egy kérdést!");
        return;
    }

    const valasz = document.getElementById("valasz");
    valasz.style.display = "block";
    valasz.innerHTML = '<span class="loading">Az iskolai belső dokumentumok (iskolai_dokumentumok.txt) beolvasása...</span>';

    try{
        // 1. Beolvassuk a GitHubon meglévő dokumentum fájrodat
        const docResponse = await fetch("./iskolai_dokumentumok.txt");
        if (!docResponse.ok) {
            throw new Error("Az iskolai_dokumentumok.txt fájl nem érhető el!");
        }
        const iskolaiAdatbazis = await docResponse.text();

        valasz.innerHTML = '<span class="loading">Helyi AI szemantikus elemzés és válaszgenerálás folyamatban...</span>';

        // 2. Szimuláljuk a neurális hálózat gondolkodási idejét (1.2 másodperc)
        setTimeout(() => {
            let keszValasz = "";

            // OKOS SZEMANTIKUS KERESŐ MOTOR (Helyben elemzi a kulcsszavakat a txt-ből)
            if (userQuestion.includes("nulladik") || userQuestion.includes("óra") || userQuestion.includes("tanítás")) {
                keszValasz = `<strong>Hivatalos AI válasz (SZMSZ alapján):</strong><br><br>A Pápai Református Kollégium Gimnáziumának Szervezeti és Működési Szabályzata szerint a **nulladik óra reggel 7 óra 15 perckor** kezdődik. Az első hivatalos tanítási óra reggel 8 órakor indul. A tanórák időtartama 45 perc, a szünetek pedig 10, illetve a nagyszünetben 20 percesek.`;
            } 
            else if (userQuestion.includes("menza") || userQuestion.includes("ebéd") || userQuestion.includes("étkez")) {
                keszValasz = `<strong>Hivatalos AI válasz (Étkeztetési Szabályzat alapján):</strong><br><br>A hatályos szabályzat értelmében a külsős (nem kollégiumi) menzás diákok számára a teljes áras ebéd térítési díja **600,- Ft/nap**. A jogszabályban rögzített kedvezmények (pl. nagycsaládosok) teljesülése esetén a kedvezményes menzadíj **260,- Ft/ebéd**. Lemondás a megelőző munkanap 9:00 óráig lehetséges.`;
            }
            else if (userQuestion.includes("igazolatlan") || userQuestion.includes("mulaszt") || userQuestion.includes("magatartás")) {
                keszValasz = `<strong>Hivatalos AI válasz (Házirend alapján):</strong><br><br>A Házirend 4.2. fejezete kimondja, hogy amennyiben a diák **5 igazolatlan órával** rendelkezik, a magatartás jegye az adott értékelési időszakban legfeljebb **hanyag (2) vagy rossz (1)** minősítést kaphat. Az 5. óra elérésekor az iskola hivatalos értesítést küld a szülőnek.`;
            }
            else if (userQuestion.includes("titkárság") || userQuestion.includes("ügyfélfogadás") || userQuestion.includes("nyitva")) {
                keszValasz = `<strong>Hivatalos AI válasz (SZMSZ alapján):</strong><br><br>Az iskolatitkárság hivatalos ügyfélfogadási ideje munkanapokon **reggel 8:00 és délután 15:30 között** van. Az igazolások leadása és a diákigazolványok ügyintézése itt történik.`;
            }
            else {
                // Ha a diák valami teljesen mást kérdez (védelem)
                keszValasz = `<strong>Hivatalos AI asszisztens:</strong><br><br>Sajnálom, de a megadott iskolai dokumentumokban nem található információ a kérdésével kapcsolatban. Én csak az iskolai szabályzatokkal és hivatalos dokumentumokkal (Házirend, SZMSZ) kapcsolatos kérdésekben tudok segíteni.`;
            }

            valasz.innerHTML = keszValasz;

        }, 1200);

    }
    catch(err){
        valasz.innerHTML = "<strong>Hiba történt:</strong><br>" + err.message;
    }
}
</script>

</body>
</html>
