<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pápai Református Kollégium - AI Asszisztens</title>
<style>
body{
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    margin:0;
    background:#f4f6f9;
    color:#333;
}
header{
    background:#002d62;
    color:white;
    padding:20px 40px;
}
.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}
input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:2px solid #ddd;
    border-radius:6px;
    margin-bottom:15px;
    font-size:16px;
}
button{
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px;
    cursor:pointer;
    width:100%;
    font-size:16px;
    font-weight:bold;
}
button:hover{
    background:#004499;
}
#valasz{
    margin-top:20px;
    padding:20px;
    background:#f7fafc;
    border-left:4px solid #002d62;
    display:none;
    white-space:pre-wrap;
}
.kulcs-btn{
    width:auto;
    float:right;
    padding:8px 12px;
    background:#777;
    margin-bottom:15px;
}
</style>
</head>
<body>

<header>
    <h1>Pápai Református Kollégium</h1>
    <p>Iskolai AI Asszisztens</p>
</header>

<div class="container">

<button class="kulcs-btn" onclick="ujKulcs()">
API kulcs módosítása
</button>

<h2>Kérdezz az iskolai dokumentumok alapján!</h2>

<input
    id="kerdes"
    type="text"
    placeholder="Például: Mikor kezdődik a nulladik óra?"
>

<button onclick="kerdezes()">
Kérdés elküldése
</button>

<div id="valasz"></div>

</div>

<script>
// Alapértelmezett beállítások és a kulcs kezelése
function apiKulcsBetoltese() {
    let key = localStorage.getItem("gemini_api_key");
    if(!key || key === "null" || key.trim() === ""){
        key = prompt("Add meg a Gemini API kulcsodat (AQ. kezdetű hosszú kód):");
        if(key && key.trim() !== ""){
            localStorage.setItem("gemini_api_key", key.trim());
        } else {
            return null;
        }
    }
    return key;
}

function ujKulcs(){
    localStorage.removeItem("gemini_api_key");
    apiKulcsBetoltese();
}

// Az oldal betöltésekor azonnal ellenőrizzük a kulcsot, hogy felugorjon az ablak
window.onload = function() {
    apiKulcsBetoltese();
}

async function kerdezes(){
    const apiKey = apiKulcsBetoltese();
    if(!apiKey){
        alert("Nincs érvényes API kulcs megadva.");
        return;
    }

    const kerdesInput = document.getElementById("kerdes");
    const userQuestion = kerdesInput.value.trim();

    if(!userQuestion){
        alert("Írj be egy kérdést!");
        return;
    }

    const valasz = document.getElementById("valasz");
    valasz.style.display = "block";
    valasz.innerHTML = "Iskolai dokumentumok betöltése...";

    try{
        // 1. Az iskolai dokumentumok beolvasása a GitHubról
        const docResponse = await fetch("./iskolai_dokumentumok.txt");
        if (!docResponse.ok) {
            throw new Error("Az iskolai_dokumentumok.txt fájl nem érhető el a szerveren!");
        }
        const iskolaiAdatbazis = await docResponse.text();

        const systemPrompt = `Te a Pápai Református Kollégium hivatalos AI asszisztense vagy. KIZÁRÓLAG az alábbi dokumentumok alapján válaszolhatsz magyarul. Ha nincs válasz a dokumentumokban, pontosan ezt írd: "Sajnálom, de én csak az iskolai szabályzatokkal és dokumentumokkal kapcsolatos kérdésekben tudok segíteni." DOKUMENTUMOK:\n${iskolaiAdatbazis}`;

        valasz.innerHTML = "A Google Gemini feldolgozása folyamatban...";

        // 2. GOLYÓÁLLÓ MEGOLDÁS: Közvetlen REST API hívás az AQ. kulcsokhoz igazított biztonságos fejléc-beállítással
        const response = await fetch(
            "https://googleapis.com",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey  // Ez a fejléc küldi el biztonságosan az AQ. kulcsot CORS hiba nélkül
                },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                { text: systemPrompt + "\n\nFelhasználó kérdése: " + userQuestion }
                            ]
                        }
                    ],
                    generationConfig: {
                        temperature: 0.1,
                        maxOutputTokens: 500
                    }
                })
            }
        );

        const data = await response.json();
        console.log(data);

        if(!response.ok){
            throw new Error(data?.error?.message || "Ismeretlen API hiba");
        }

        // 3. A kész szöveges válasz kinyerése a Google hivatalos JSON adatstruktúrájából
        const geminiValasz = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Nem érkezett válasz.";

        valasz.innerHTML = "<strong>AI válasz:</strong><br><br>" + geminiValasz;

    }
    catch(err){
        console.error(err);
        valasz.innerHTML = "<strong>Hiba történt:</strong><br>" + err.message;
    }
}
</script>

</body>
</html>
