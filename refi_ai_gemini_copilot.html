<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pápai Református Kollégium - AI Asszisztens</title>
<style>
body{
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    margin:0;
    background:#f4f6f9;
    color:#333;
}
header{
    background:#002d62;
    color:white;
    padding:20px 40px;
}
.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}
input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:2px solid #ddd;
    border-radius:6px;
    margin-bottom:15px;
    font-size:16px;
}
button{
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px;
    cursor:pointer;
    width:100%;
    font-size:16px;
    font-weight:bold;
}
button:hover{
    background:#004499;
}
#valasz{
    margin-top:20px;
    padding:20px;
    background:#f7fafc;
    border-left:4px solid #002d62;
    display:none;
    white-space:pre-wrap;
}
.kulcs-btn{
    width:auto;
    float:right;
    padding:8px 12px;
    background:#777;
    margin-bottom:15px;
}
</style>

<!-- GOOGLE GEMINI HIVATALOS BÖNGÉSZŐS MODUL BETÖLTÉSE (CORS ELLENI VÉDELEM) -->
<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run"
    }
  }
</script>

</head>
<body>

<header>
    <h1>Pápai Református Kollégium</h1>
    <p>Iskolai AI Asszisztens</p>
</header>

<div class="container">

<button class="kulcs-btn" onclick="ujKulcs()">
API kulcs módosítása
</button>

<h2>Kérdezz az iskolai dokumentumok alapján!</h2>

<input
    id="kerdes"
    type="text"
    placeholder="Például: Mikor kezdődik a nulladik óra?"
>

<button onclick="kerdezes()">
Kérdés elküldése
</button>

<div id="valasz"></div>

</div>

<script type="module">
// Importáljuk a Google hivatalos kliensoldali AI modulját
import { GoogleGenAI } from '@google/generative-ai';

function apiKulcsBetoltese() {
    let key = localStorage.getItem("gemini_api_key");
    if(!key){
        key = prompt("Add meg a Gemini API kulcsodat:");
        if(key){
            localStorage.setItem("gemini_api_key", key.trim());
        }
    }
    return key;
}

// Elérhetővé tesszük a gombnak a globális névtérben
window.ujKulcs = function() {
    localStorage.removeItem("gemini_api_key");
    apiKulcsBetoltese();
}

window.kerdezes = async function() {
    const apiKey = apiKulcsBetoltese();
    if(!apiKey){
        alert("Nincs API kulcs megadva.");
        return;
    }

    const kerdesInput = document.getElementById("kerdes");
    const userQuestion = kerdesInput.value.trim();

    if(!userQuestion){
        alert("Írj be egy kérdést!");
        return;
    }

    const valasz = document.getElementById("valasz");
    valasz.style.display = "block";
    valasz.innerHTML = "Dokumentumok betöltése...";

    try{
        // 1. Az iskolai_dokumentumok.txt beolvasása a GitHubról
        const docResponse = await fetch("./iskolai_dokumentumok.txt");
        if (!docResponse.ok) {
            throw new Error("Az iskolai_dokumentumok.txt fájl nem található vagy nem olvasható!");
        }
        const iskolaiAdatbazis = await docResponse.text();

        const systemPrompt = `Te a Pápai Református Kollégium hivatalos AI asszisztense vagy. KIZÁRÓLAG az alábbi dokumentumok alapján válaszolhatsz. Ha nincs válasz a dokumentumokban, akkor pontosan ezt írd: "Sajnálom, de én csak az iskolai szabályzatokkal és dokumentumokkal kapcsolatos kérdésekben tudok segíteni." DOKUMENTUMOK:\n${iskolaiAdatbazis}`;

        valasz.innerHTML = "A Google Gemini biztonságos feldolgozása folyamatban...";

        // 2. A Google hivatalos SDK-jának inicializálása (Ez kezeli az AQ. kulcsokat CORS hiba nélkül)
        const ai = new GoogleGenAI({ apiKey: apiKey });
        
        // Meghívjuk a Gemini 1.5 Flash modellt
        const response = await ai.models.generateContent({
            model: 'gemini-1.5-flash',
            contents: [
                { role: 'user', parts: [{ text: systemPrompt }] },
                { role: 'user', parts: [{ text: "Felhasználó kérdése: " + userQuestion }] }
            ],
            config: {
                temperature: 0.1,
                maxOutputTokens: 500
            }
        });

        // 3. A válasz kinyerése a hivatalos Google függvény segítségével
        const geminiValasz = response.text || "Nem érkezett válasz.";

        valasz.innerHTML = "<strong>AI válasz:</strong><br><br>" + geminiValasz;

    }
    catch(err){
        console.error(err);
        valasz.innerHTML = "<strong>Hiba:</strong><br>" + err.message;
    }
}
</script>

</body>
</html>
