<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Optikai Lencse Szimulátor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: inline-block; }
        canvas { background: #fff; border: 1px solid #eee; margin-top: 10px; }
        .controls { margin-bottom: 20px; display: flex; gap: 30px; justify-content: center; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .data { font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold; margin: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; display: inline-block; padding-bottom: 5px; }
    </style>
</head>
<body>
<h1 style="text-align:center; color: #1a237e;">🔭Optika:Lencsék</h1>
<h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
       <div class="box">
        <div class="controls">
            <div>
                <label>Típus:</label>
                <select id="mode" onchange="draw()">
                    <option value="convex">Gyűjtőlencse (+)</option>
                    <option value="concave">Szórólencse (-)</option>
                </select>
            </div>
            <div>
                <label>Tárgytáv. (t):</label>
                <input type="range" id="do" min="20" max="400" value="200" oninput="draw()">
            </div>
            <div>
                <label>Fókusz (f):</label>
                <input type="range" id="f" min="40" max="180" value="100" oninput="draw()">
            </div>
        </div>

        <div id="info" class="data">Számítás...</div>
        <br>
        <canvas id="opticsCanvas" width="900" height="450"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('opticsCanvas');
        const ctx = canvas.getContext('2d');
        const ho = 60; 

        function draw() {
            const t = parseFloat(document.getElementById('do').value);
            const fAbs = parseFloat(document.getElementById('f').value);
            const isConvex = document.getElementById('mode').value === "convex";
            const f = isConvex ? fAbs : -fAbs;

            let k = (f * t) / (t - f);
            let N = -k / t;
            let hk = ho * N;

            document.getElementById('info').innerText = 
                `f = ${(fAbs/10).toFixed(1)} cm | t = ${(t/10).toFixed(1)} cm | k = ${(k/10).toFixed(1)} cm | N = ${Math.abs(N).toFixed(2)}x`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Tengely és fókuszok
            ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(cx - fAbs, cy, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + fAbs, cy, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillText('F1', cx - fAbs - 10, cy + 25); ctx.fillText('F2', cx + fAbs - 10, cy + 25);

            // Lencse
            ctx.strokeStyle = isConvex ? '#3498db' : '#e74c3c'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(cx, cy - 200); ctx.lineTo(cx, cy + 200); ctx.stroke();
            
            // Tárgy
            drawArrow(cx - t, cy, cx - t, cy - ho, '#27ae60', 5, "T");

            // --- HÁROM SUGÁR ---
            // 1. Középponti (Szürke)
            ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(cx - t, cy - ho); ctx.lineTo(cx + 400, cy + (ho/t)*400); ctx.stroke();

            // 2. Párhuzamos -> Fókusz (Narancs)
            ctx.strokeStyle = '#f39c12'; ctx.beginPath();
            ctx.moveTo(cx - t, cy - ho); ctx.lineTo(cx, cy - ho);
            let slope2 = (isConvex) ? (ho / fAbs) : (-ho / fAbs);
            ctx.lineTo(cx + 400, cy - ho + slope2 * 400); ctx.stroke();
            if(!isConvex || t < fAbs) { // Szaggatott hosszabbítás hátra
                ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(cx, cy - ho); ctx.lineTo(cx + k, cy - hk); ctx.stroke(); ctx.setLineDash([]);
            }

            // 3. Fókuszirányú -> Párhuzamos (Türkiz)
            ctx.strokeStyle = '#1abc9c'; ctx.beginPath();
            ctx.moveTo(cx - t, cy - ho);
            if (isConvex) {
                if (t > fAbs) { // F1-en át
                    let m = ho / (t - fAbs);
                    let y_hit = -ho + m * t;
                    ctx.lineTo(cx, cy + y_hit); ctx.lineTo(cx + 400, cy + y_hit);
                } else { // Úgy érkezik, mintha F1-ből jönne (virtuális)
                    let m = ho / (fAbs - t);
                    let y_hit = -ho - m * t;
                    ctx.lineTo(cx, cy + y_hit); ctx.lineTo(cx + 400, cy + y_hit);
                    ctx.setLineDash([5, 5]); ctx.moveTo(cx - fAbs, cy); ctx.lineTo(cx - t, cy - ho); ctx.setLineDash([]);
                }
            } else { // Szóró: F2 felé tart
                let m = ho / (fAbs + t);
                let y_hit = -ho + m * t;
                ctx.lineTo(cx, cy + y_hit); ctx.lineTo(cx + 450, cy + y_hit);
                ctx.setLineDash([5, 5]); ctx.moveTo(cx, cy + y_hit); ctx.lineTo(cx + fAbs, cy); ctx.setLineDash([]);
            }
            ctx.stroke();

            // Kép
            if (Math.abs(k) < 1000) {
                drawArrow(cx + k, cy, cx + k, cy - hk, k > 0 ? '#d35400' : '#8e44ad', 4, k > 0 ? "V. kép" : "Virt. kép");
            }
        }

        function drawArrow(x1, y1, x2, y2, color, width, label) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 12 * Math.cos(angle - Math.PI/7), y2 - 12 * Math.sin(angle - Math.PI/7));
            ctx.lineTo(x2 - 12 * Math.cos(angle + Math.PI/7), y2 - 12 * Math.sin(angle + Math.PI/7));
            ctx.fill(); ctx.fillText(label, x2 - 10, y2 < y1 ? y2 - 10 : y2 + 20);
        }
        draw();
    </script>
</body>
</html>
