<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika Mester - Emelők (Minden paraméterre)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .theory-box { background: #e3f2fd; padding: 15px; border-left: 6px solid #2196f3; border-radius: 6px; margin-bottom: 20px; line-height: 1.6; }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 450px; }
        
        .illustration { text-align: center; margin: 20px 0; background: #ffffff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        input { padding: 10px; width: 130px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 10px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        .highlight { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Egyszerű gépek: Emelők</h1>
   <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (5 feladat)</button>
    </div>

    <div id="theory-section" class="theory-box">
        <b>Elmélet:</b> Az emelő akkor van egyensúlyban, ha <b>F<sub>1</sub> · k<sub>1</sub> = F<sub>2</sub> · k<sub>2</sub></b>.
        <div style="display: flex; justify-content: space-around; margin-top: 15px; font-size: 0.9em;">
            <div style="text-align:center;">
                <svg width="140" height="80"><rect x="10" y="30" width="120" height="4" fill="#555"/><path d="M70 34 L60 55 L80 55 Z" fill="#1a237e"/><line x1="30" y1="34" x2="30" y2="55" stroke="red" stroke-width="2"/><line x1="110" y1="34" x2="110" y2="55" stroke="red" stroke-width="2"/><text x="45" y="25">Kétkarú</text></svg>
                <br>A tengely középen van.
            </div>
            <div style="text-align:center;">
                <svg width="140" height="80"><rect x="10" y="30" width="120" height="4" fill="#555"/><path d="M10 34 L0 55 L20 55 Z" fill="#1a237e"/><line x1="60" y1="34" x2="60" y2="55" stroke="red" stroke-width="2"/><line x1="120" y1="30" x2="120" y2="10" stroke="green" stroke-width="2"/><text x="45" y="25">Egykarú</text></svg>
                <br>A tengely a szélen van.
            </div>
        </div>
    </div>

    <div class="exercise-area">
        <div id="progress-text" style="font-weight:bold; color:#1a237e; margin-bottom:10px; display:none;"></div>
        <div id="illustration" class="illustration"></div>
        <div id="exercise-text" style="font-size: 1.2em; margin-bottom: 20px; line-height: 1.5;"></div>
        <div id="input-container">
            <span id="label-text"></span>: <input type="number" id="user-ans" step="any"> <span id="unit-text"></span>
        </div>
        <div id="controls" style="margin-top: 20px;">
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" id="new-btn" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Súgó / Megoldás</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', currentTask = {}, solSeen = false, examStep = 0, examPoints = 0;
    let seconds = 0, timerInterval;

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        if(m === 'felel') startExam(); else stopExam();
    }

    function startExam() {
        examStep = 1; examPoints = 0; seconds = 0;
        document.getElementById('exam-timer').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        document.getElementById('grade-display').style.display = 'none';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
        generateTask();
    }

    function stopExam() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').style.display = 'none';
        document.getElementById('progress-text').style.display = 'none';
        generateTask();
    }

    function updateTimerDisplay() {
        let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
        document.getElementById('exam-timer').innerText = `${m}:${s}`;
    }

    function generateTask() {
        solSeen = false;
        document.getElementById('feedback').innerText = "";
        document.getElementById('solution-box').style.display = "none";
        document.getElementById('user-ans').value = "";
        if(appMode === 'felel') document.getElementById('progress-text').innerText = `Feladat: ${examStep} / 5`;

        const isTwoArmed = Math.random() > 0.5;
        const missingParam = Math.floor(Math.random() * 4); // 0:F1, 1:k1, 2:F2, 3:k2
        
        let F1 = (Math.floor(Math.random() * 10) + 2) * 10;
        let k1 = (Math.floor(Math.random() * 6) + 2) / 10;
        let F2 = (Math.floor(Math.random() * 10) + 2) * 10;
        let k2 = parseFloat(((F1 * k1) / F2).toFixed(2));
        
        // Újraszámoljuk, hogy kerek legyen a várt eredmény ha F-et kérdezünk
        if(missingParam < 2) { // F1 vagy k1 a kérdés, akkor fixáljuk a többit
             F1 = parseFloat(((F2 * k2) / k1).toFixed(1));
        }

        const typeLabel = isTwoArmed ? "Kétkarú emelő" : "Egykarú emelő";
        const labels = ["F₁ erő", "k₁ erőkar", "F₂ erő", "k₂ erőkar"];
        const units = ["N", "m", "N", "m"];
        const targetValue = [F1, k1, F2, k2][missingParam];

        let svgHtml = `
        <svg width="300" height="150" viewBox="0 0 300 150">
            <defs>
                <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="red" /></marker>
                <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="green" /></marker>
            </defs>
            <rect x="50" y="70" width="200" height="6" fill="#555" rx="2"/>`;

        if(isTwoArmed) {
            svgHtml += `<path d="M150 76 L140 100 L160 100 Z" fill="#1a237e"/>
                <line x1="80" y1="73" x2="80" y2="110" stroke="red" stroke-width="3" marker-end="url(#arrowRed)"/>
                <text x="70" y="130" font-weight="bold" fill="red">${missingParam===0 ? 'F₁ (?)' : 'F₁: '+F1+'N'}</text>
                <text x="70" y="60" font-size="12">${missingParam===1 ? 'k₁: ?' : 'k₁: '+k1+'m'}</text>
                <line x1="220" y1="73" x2="220" y2="110" stroke="red" stroke-width="3" marker-end="url(#arrowRed)"/>
                <text x="210" y="130" font-weight="bold" fill="red">${missingParam===2 ? 'F₂ (?)' : 'F₂: '+F2+'N'}</text>
                <text x="210" y="60" font-size="12">${missingParam===3 ? 'k₂: ?' : 'k₂: '+k2+'m'}</text>`;
        } else {
            svgHtml += `<path d="M50 76 L40 100 L60 100 Z" fill="#1a237e"/>
                <line x1="120" y1="73" x2="120" y2="110" stroke="red" stroke-width="3" marker-end="url(#arrowRed)"/>
                <text x="110" y="130" font-weight="bold" fill="red">${missingParam===0 ? 'F₁ (?)' : 'F₁: '+F1+'N'}</text>
                <text x="100" y="60" font-size="12">${missingParam===1 ? 'k₁: ?' : 'k₁: '+k1+'m'}</text>
                <line x1="240" y1="70" x2="240" y2="30" stroke="green" stroke-width="3" marker-end="url(#arrowGreen)"/>
                <text x="230" y="25" font-weight="bold" fill="green">${missingParam===2 ? 'F₂ (?)' : 'F₂: '+F2+'N'}</text>
                <text x="210" y="85" font-size="12">${missingParam===3 ? 'k₂: ?' : 'k₂: '+k2+'m'}</text>`;
        }
        svgHtml += `</svg>`;

        currentTask = {
            ans: targetValue, unit: units[missingParam], label: labels[missingParam],
            text: `<b>${typeLabel}:</b> Számítsd ki a hiányzó adatot az egyensúlyhoz! <br> Adatok: ` + 
                  [0,1,2,3].filter(i => i !== missingParam).map(i => `${labels[i]} = ${[F1,k1,F2,k2][i]}${units[i]}`).join(", "),
            step: `Képlet: F₁ · k₁ = F₂ · k₂ <br> Behelyettesítés: ${missingParam===0?'F₁':F1} · ${missingParam===1?'k₁':k1} = ${missingParam===2?'F₂':F2} · ${missingParam===3?'k₂':k2} <br> Eredmény: ${targetValue} ${units[missingParam]}`,
            svg: svgHtml
        };

        document.getElementById('illustration').innerHTML = currentTask.svg;
        document.getElementById('exercise-text').innerHTML = currentTask.text;
        document.getElementById('label-text').innerText = currentTask.label;
        document.getElementById('unit-text').innerText = currentTask.unit;
    }

    function checkAnswer() {
        const val = parseFloat(document.getElementById('user-ans').value);
        if (Math.abs(val - currentTask.ans) < 0.1) {
            document.getElementById('feedback').innerHTML = "✅ Helyes!"; document.getElementById('feedback').style.color = "green";
            if(appMode === 'felel') {
                if(!solSeen) examPoints++;
                if(examStep < 5) { examStep++; setTimeout(generateTask, 800); } else finishExam();
            }
        } else {
            document.getElementById('feedback').innerHTML = "❌ Hibás számítás!"; document.getElementById('feedback').style.color = "red";
        }
    }

    function showSolution() {
        solSeen = true;
        document.getElementById('solution-box').innerHTML = `<b>Levezetés:</b><br>${currentTask.step}`;
        document.getElementById('solution-box').style.display = "block";
    }

    async function finishExam() {
    clearInterval(timerInterval);
    
    // --- 1. IP CÍM LEKÉRÉSE (Választható, de jó azonosító) ---
    let ip = "Lekérés alatt...";
    try {
        const response = await fetch('https://api.ipify.org');
        const data = await response.json();
        ip = data.ip;
    } catch (e) { ip = "Ismeretlen"; }

    // --- 2. JEGY ÉS NÉV ---
    let j = examPoints >= 90 ? 5 : examPoints >= 70 ? 4 : examPoints >= 50 ? 3 : examPoints >= 30 ? 2 : 1;
    let nev = prompt("Gratulálunk! Add meg a neved a bizonyítványhoz:");
    if (!nev) nev = "Névtelen Tanuló";

    // --- 3. EGYEDI KÓD GENERÁLÁSA (Név + Jegy + Titkos kulcs) ---
    let titkosKulcs = "Refi7B"; 
    let nyers = nev + j + titkosKulcs;
    let hash = 0;
    for (let i = 0; i < nyers.length; i++) {
        hash = ((hash << 5) - hash) + nyers.charCodeAt(i);
        hash |= 0;
    }
    let azonosito = "BIZ-" + Math.abs(hash).toString(16).toUpperCase();

    // --- 4. EMAIL ADATOK ÖSSZEÁLLÍTÁSA ---
    const sajatEmail = "vuk1960@gmail.com"; // <--- IDE ÍRD AZ EMAIL CÍMEDET!
    const targy = encodeURIComponent(`BIZONYÍTVÁNY - ${nev} - Jegy: ${j}`);
    const uzenet = encodeURIComponent(
        `Tisztelt Tanár Úr!\n\n` +
        `Sikeresen teljesítettem a feladatot.\n` +
        `Név: ${nev}\n` +
        `Jegy: ${j}\n` +
        `Pontszám: ${examPoints}/100\n` +
        `IP azonosító: ${ip}\n` +
        `Ellenőrző kód: ${azonosito}\n\n` +
        `Dátum: ${new Date().toLocaleString('hu-HU')}`
    );

    const mailtoLink = `mailto:${sajatEmail}?subject=${targy}&body=${uzenet}`;

    // --- 5. MEGJELENÍTÉS A WEBOLDALON ---
    const g = document.getElementById('grade-display');
    g.style.display = "block";
    g.innerHTML = `
        <h2>Eredmény</h2>
        <p>Tanuló: <b>${nev}</b></p>
        <p>Jegy: <b>${j}</b> (${examPoints}/100 pont)</p>
        <p style="font-size: 0.8em; color: gray;">Kód: ${azonosito}</p>
        <hr>
        <button class="action-btn" onclick="window.location.href='${mailtoLink}'" style="background-color: #4CAF50; color: white; padding: 10px;">
             📧 Bizonyítvány beküldése emailben
        </button>
        <br><br>
        <button class="action-btn" onclick="setMode('gyak')">Újra</button>
    `;
}
    generateTask();
</script>
</body>
</html>
