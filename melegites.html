<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika Mester - Hőtan Oktatócsomag</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #00796b; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }

        .theory-box { background: #e0f2f1; padding: 15px; border-left: 6px solid #00796b; border-radius: 6px; margin-bottom: 20px; display: none; line-height: 1.5; }
        .theory-btn { background: #ff9800; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }

        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 250px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; max-width: 500px; align-items: center; }
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 5px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        
        .chart-container { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .chart-axis { stroke: #333; stroke-width: 2; }
        .chart-grid { stroke: #e0e0e0; stroke-dasharray: 4; }
        .chart-line { stroke: #e53935; stroke-width: 3; fill: none; }
        .chart-text { font-size: 11px; fill: #555; }
        .chart-dot { fill: #1a237e; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Hőtan: Víz melegítése és fázisátalakulásai</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (Jegyre)</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-cat1" onclick="switchCat('cat1')">1. Szint (Könnyű)</button>
        <button class="nav-btn" id="btn-cat2" onclick="switchCat('cat2')">2. Szint (Közepes)</button>
        <button class="nav-btn" id="btn-cat3" onclick="switchCat('cat3')">3. Szint (Haladó)</button>
        <button class="nav-btn" id="btn-cat4" onclick="switchCat('cat4')">4. Szint (Összetett)</button>
    </div>

    <button class="theory-btn" onclick="toggleTheory()">📖 Elméleti összefoglaló</button>
    <div id="theory-text" class="theory-box"></div>

    <div class="exercise-area">
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;"></div>
        
        <div id="inputs-container"></div>
        
        <div id="controls">
            <button class="action-btn" id="check-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Megoldás levezetése</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
        
        <div id="chart-area" class="chart-container" style="display:none;">
            <h3>Melegítési grafikon (T - Q diagram)</h3>
            <div id="svg-holder"></div>
        </div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>
<script>
    let appMode = 'gyak', currentCat = 'cat1', currentTaskData = {}, solSeen = false;
    let examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }, examDone = { cat1: false, cat2: false, cat3: false, cat4: false };
    let seconds = 0, timerInterval;

    const c_ice = 2.1;   
    const L_fus = 334;   
    const c_water = 4.2; 
    const L_vap = 2260;  
    const c_steam = 2.0; 

    const theoryData = {
        cat1: "<b>Melegítés halmazállapot-változás nélkül:</b><br>Ha nincs halmazállapot-változás, a szükséges hőmennyiség: <i>Q = c · m · ΔT</i>.<br>Víz fajhője: 4,2 kJ/(kg·°C).",
        cat2: "<b>Olvadás és fagyás:</b><br>A jég 0 °C-on olvad meg. Az olvadáshoz szükséges hő: <i>Q = L_olv · m</i>.<br>Jég olvadáshője: 334 kJ/kg. A jég felmelegítése 0 °C-ra: <i>c_jég = 2,1 kJ/(kg·°C)</i>.",
        cat3: "<b>Forrás és párolgás:</b><br>A víz 100 °C-on forr fel (standard nyomáson). A forráshoz szükséges hő: <i>Q = L_forr · m</i>.<br>Víz forráshője: 2260 kJ/kg. A keletkező gőz tovább melegíthető: <i>c_gőz = 2,0 kJ/(kg·°C)</i>.",
        cat4: "<b>A teljes folyamat (Jégből gőz):</b><br>Összetett feladatok esetén minden szakaszt külön kell számolni, majd a részeredményeket összeadni: <i>Q_összes = Q₁ + Q₂ + Q₃ + Q₄ + Q₅</i>."
    };

    function fmt(x, d = 1) {
        return Number(x).toLocaleString('hu-HU', { minimumFractionDigits: 0, maximumFractionDigits: d });
    }

    function toggleTheory() {
        const box = document.getElementById('theory-text');
        box.innerHTML = theoryData[currentCat];
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        resetExam();
        if(m === 'felel') startTimer(); else stopTimer();
        generateTask();
    }

    function startTimer() { 
        seconds = 0; 
        document.getElementById('exam-timer').style.display = 'block'; 
        clearInterval(timerInterval); 
        timerInterval = setInterval(() => { 
            seconds++; 
            let m = Math.floor(seconds/60).toString().padStart(2,'0'), 
                s = (seconds%60).toString().padStart(2,'0'); 
            document.getElementById('exam-timer').innerText = `${m}:${s}`; 
        }, 1000); 
    }
    
    function stopTimer() { 
        clearInterval(timerInterval); 
        document.getElementById('exam-timer').style.display = 'none'; 
    }
    
    function resetExam() { 
        examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }; 
        examDone = { cat1: false, cat2: false, cat3: false, cat4: false }; 
        document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('completed')); 
        document.getElementById('grade-display').style.display = 'none'; 
    }
    
    function switchCat(cat) { 
        currentCat = cat; 
        document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('active')); 
        document.getElementById('btn-' + cat).classList.add('active'); 
        if(document.getElementById('theory-text').style.display === 'block') toggleTheory(); 
        generateTask(); 
    }

    function generateTask() {
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('solution-box').style.display = 'none';
        document.getElementById('solution-box').innerHTML = '';
        solSeen = false;

        if (appMode === 'felel' && examDone[currentCat]) {
            document.getElementById('exercise-text').innerHTML = "Ezt a szintet a felelés során már teljesítetted.";
            document.getElementById('inputs-container').innerHTML = "";
            document.getElementById('chart-area').style.display = 'none';
            return;
        }

        let m = Math.floor(Math.random() * 5) + 1; 
        let t1, t2;

        if (currentCat === 'cat1') {
            t1 = Math.floor(Math.random() * 40) + 5; 
            t2 = t1 + Math.floor(Math.random() * 40) + 15; 
        } else if (currentCat === 'cat2') {
            t1 = -Math.floor(Math.random() * 15) - 5; 
            t2 = Math.floor(Math.random() * 50) + 10; 
        } else if (currentCat === 'cat3') {
            t1 = Math.floor(Math.random() * 50) + 20; 
            t2 = 100 + Math.floor(Math.random() * 20) + 5; 
        } else {
            t1 = -Math.floor(Math.random() * 15) - 5; 
            t2 = 100 + Math.floor(Math.random() * 20) + 5;
        }

        calculateSteps(m, t1, t2);
        renderUI(m, t1, t2);

        if (appMode === 'gyak') {
            document.getElementById('chart-area').style.display = 'block';
            document.getElementById('sol-btn').style.display = 'inline-block';
            drawChart();
        } else {
            document.getElementById('chart-area').style.display = 'none';
            document.getElementById('sol-btn').style.display = 'none';
        }
    }
    function calculateSteps(m, t1, t2) {
        let steps = [];
        let runningQ = 0;
        let points = [{q: 0, t: t1}];

        if (t1 < 0) {
            let target = Math.min(0, t2);
            let q = c_ice * m * (target - t1);
            runningQ += q;
            steps.push({ id: 'Q1', name: 'Jég melegítése 0 °C-ra (Q₁)', val: q, desc: `c_jég · m · ΔT = 2,1 · ${m} · ${0 - t1}` });
            points.push({q: runningQ, t: target});
            
            if (t2 >= 0) {
                let q_olv = L_fus * m;
                runningQ += q_olv;
                steps.push({ id: 'Q2', name: 'Jég megolvasztása (Q₂)', val: q_olv, desc: `L_olv · m = 334 · ${m}` });
                points.push({q: runningQ, t: 0});
            }
        }

        if (t2 > 0 && t1 < 100) {
            let start = Math.max(0, t1);
            let target = Math.min(100, t2);
            let q = c_water * m * (target - start);
            runningQ += q;
            steps.push({ id: 'Q3', name: 'Víz melegítése (Q₃)', val: q, desc: `c_víz · m · ΔT = 4,2 · ${m} · ${target - start}` });
            points.push({q: runningQ, t: target});
        }

        if (t1 < 100 && t2 >= 100) {
            let q_forr = L_vap * m;
            runningQ += q_forr;
            steps.push({ id: 'Q4', name: 'Víz elforralása (Q₄)', val: q_forr, desc: `L_forr · m = 2260 · ${m}` });
            points.push({q: runningQ, t: 100});
        }

        if (t2 > 100) {
            let start = Math.max(100, t1);
            let q = c_steam * m * (t2 - start);
            runningQ += q;
            steps.push({ id: 'Q5', name: 'Gőz túlhevítése (Q₅)', val: q, desc: `c_gőz · m · ΔT = 2,0 · ${m} · ${t2 - start}` });
            points.push({q: runningQ, t: t2});
        }

        currentTaskData = { m: m, t1: t1, t2: t2, steps: steps, totalQ: runningQ, points: points };
    }

    function renderUI(m, t1, t2) {
        document.getElementById('exercise-text').innerHTML = `Határozzuk meg, mennyi hő szükséges <b>${m} kg</b> tömegű, <b>${t1} °C</b> hőmérsékletű víz (vagy jég) felmelegítéséhez <b>${t2} °C</b>-ra! <br><small>Számoljon a standard értékekkel (c_jég=2,1; L_olv=334; c_víz=4,2; L_forr=2260; c_gőz=2,0)!</small>`;
        
        let html = "";
        currentTaskData.steps.forEach(s => {
            html += `<div class="input-row">
                        <label>${s.name}:</label>
                        <span><input type="text" id="input-${s.id}" placeholder="kJ-ban"> kJ</span>
                     </div>`;
        });

        html += `<div class="input-row" style="border-top: 2px solid #ccc; padding-top: 10px; font-weight: bold;">
                    <label>Teljes szükséges hő (Q_összes):</label>
                    <span><input type="text" id="input-total" placeholder="kJ-ban"> kJ</span>
                 </div>`;
        
        document.getElementById('inputs-container').innerHTML = html;
    }

    function checkAnswers() {
        let allCorrect = true;
        let errorList = [];

        currentTaskData.steps.forEach(s => {
            let el = document.getElementById(`input-${s.id}`);
            let userVal = parseFloat(el.value.replace(',', '.'));
            if (Math.abs(userVal - s.val) < 0.1) {
                el.style.borderColor = "#4caf50";
            } else {
                el.style.borderColor = "#f44336";
                allCorrect = false;
                errorList.push(s.name);
            }
        });

        let totalEl = document.getElementById('input-total');
        let userTotal = parseFloat(totalEl.value.replace(',', '.'));
        if (Math.abs(userTotal - currentTaskData.totalQ) < 0.1) {
            totalEl.style.borderColor = "#4caf50";
        } else {
            totalEl.style.borderColor = "#f44336";
            allCorrect = false;
            errorList.push("Teljes hő");
        }

        if (allCorrect) {
            document.getElementById('feedback').innerHTML = "<span style='color:green;'>✓ Kiváló! Minden érték tökéletesen helyes.</span>";
            if(appMode === 'felel') {
                examScore[currentCat] = solSeen ? 0.5 : 1;
                examDone[currentCat] = true;
                document.getElementById('btn-' + currentCat).classList.add('completed');
                checkExamEnd();
            }
        } else {
            document.getElementById('feedback').innerHTML = "<span style='color:red;'>✗ Hibás érték(ek): " + errorList.join(', ') + "</span>";
        }
    }

    function showSolution() {
        solSeen = true;
        let html = "<h4>A megoldás lépései:</h4><ul>";
        currentTaskData.steps.forEach(s => {
            html += `<li><b>${s.name}:</b> ${s.desc} = <b>${fmt(s.val)} kJ</b></li>`;
        });
        html += `</ul><p><b>Összesen:</b> Q_összes = <b>${fmt(currentTaskData.totalQ)} kJ</b></p>`;
        document.getElementById('solution-box').innerHTML = html;
        document.getElementById('solution-box').style.display = 'block';
    }

    function checkExamEnd() {
        if(examDone.cat1 && examDone.cat2 && examDone.cat3 && examDone.cat4) {
            stopTimer();
            let totalPoints = examScore.cat1 + examScore.cat2 + examScore.cat3 + examScore.cat4;
            let percent = (totalPoints / 4) * 100;
            let grade = percent >= 85 ? 5 : percent >= 70 ? 4 : percent >= 55 ? 3 : percent >= 40 ? 2 : 1;

            let gBox = document.getElementById('grade-display');
            gBox.innerHTML = `<h2>Felelés eredménye</h2>
                              <p>Idő: ${document.getElementById('exam-timer').innerText}</p>
                              <p>Pontszám: ${totalPoints} / 4 pont (${fmt(percent, 0)}%)</p>
                              <h1 style="font-size:3em; color:#1a237e;">Érdemjegy: ${grade}</h1>`;
            gBox.style.display = 'block';
        }
    }

    function drawChart() {
        const pts = currentTaskData.points;
        const maxQ = pts[pts.length - 1].q;
        const minT = -20, maxT = 130;
        const w = 500, h = 300, padX = 50, padY = 40;

        function mapX(q) { return padX + (q / (maxQ || 1)) * (w - 2 * padX); }
        function mapY(t) { return h - padY - ((t - minT) / (maxT - minT)) * (h - 2 * padY); }

        let svg = `<svg width="${w}" height="${h}" style="background:#fafafa; border:1px solid #ccc;">`;

        for(let t = -10; t <= 120; t += 10) {
            if(t === 0 || t === 100 || t === 50) {
                let y = mapY(t);
                svg += `<line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" class="chart-grid" />`;
                svg += `<text x="${padX - 10}" y="${y + 4}" class="chart-text" text-anchor="end">${t}°C</text>`;
            }
        }

        svg += `<line x1="${padX}" y1="${mapY(0)}" x2="${w-padX}" y2="${mapY(0)}" class="chart-axis" />`; 
        svg += `<line x1="${padX}" y1="${h-padY}" x2="${padX}" y2="${padY}" class="chart-axis" />`; 

        let polyPoints = pts.map(p => `${mapX(p.q)},${mapY(p.t)}`).join(' ');
        svg += `<polyline points="${polyPoints}" class="chart-line" />`;

        pts.forEach((p, idx) => {
            let cx = mapX(p.q), cy = mapY(p.t);
            svg += `<circle cx="${cx}" cy="${cy}" r="4" class="chart-dot" />`;
            if (idx === 0 || idx === pts.length - 1 || p.t === 0 || p.t === 100) {
                svg += `<text x="${cx}" y="${cy - 8}" class="chart-text" text-anchor="middle">${fmt(p.q,0)} kJ</text>`;
            }
        });

        svg += `<text x="${w - 20}" y="${mapY(0) + 15}" class="chart-text" font-weight="bold" text-anchor="end">Q (kJ)</text>`;
        svg += `<text x="${padX + 10}" y="${padY + 10}" class="chart-text" font-weight="bold">T (°C)</text></svg>`;
        document.getElementById('svg-holder').innerHTML = svg;
    }

    generateTask();
</script>
</body>
</html>
