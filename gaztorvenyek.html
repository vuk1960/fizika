<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika Mester - Gáztörvények</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #2196f3; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 400px; }
        .theory-img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; display: block; margin: 0 auto; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 20px 0; }
        .input-group { background: #cfd8dc; padding: 15px; border-radius: 8px; border: 1px solid #b0bec5; display: flex; justify-content: space-between; align-items: center; }
        input { padding: 8px; width: 80px; border: 2px solid #ccc; border-radius: 6px; font-weight: bold; font-size: 1.1em; }
        .given-val { background: #4caf50; color: white; padding: 5px 12px; border-radius: 4px; font-weight: bold; }
        .action-btn { background: #1a237e; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 20px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.8; font-family: 'Courier New', monospace; white-space: pre-wrap; font-size: 0.95em; }
        .p-input { display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none; text-align:right; font-weight:bold; color:red; font-size:1.5em;">00:00</div>
    <h1 style="color: #1a237e; text-align: center;">Gáztörvények Gyakorló</h1>
    
    <div class="mode-selector">
        <button id="m-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="m-exam" class="mode-btn" onclick="setMode('exam')">Vizsga</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-boyle" onclick="switchCat('boyle')">Boyle–Mariotte</button>
        <button class="nav-btn" id="btn-gay" onclick="switchCat('gay')">Gay-Lussac</button>
        <button class="nav-btn" id="btn-charles" onclick="switchCat('charles')">Charles</button>
        <button class="nav-btn" id="btn-egyesitett" onclick="switchCat('egyesitett')">Egyesített</button>
    </div>

    <div class="exercise-area">
        <img id="theory-pic" src="elmelet1.jpg" class="theory-img">
        <p id="task-desc" style="font-size: 1.1em; padding: 15px; background: #fff; border: 1px solid #2196f3; border-radius: 8px;"></p>
        
        <div class="input-grid" id="input-fields"></div>

        <div id="controls">
            <button class="action-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#ff9800" onclick="showSolution()">Levezetés</button>
        </div>

        <div id="feedback" style="margin-top:15px; font-weight: bold; font-size: 1.2em;"></div>
        <div id="solution-box" class="solution"></div>
    </div>
</div>

<script>
    let appMode = 'gyak', currentCat = 'boyle';
    let currentTask = { vals: {}, targetKey: "", steps: "" };

    const labels = { p1: "p1", V1: "V1", T1: "T1", p2: "p2", V2: "V2", T2: "T2" };
    const units = { p: "Pa", V: "m³", T: "K" };

    function toNormal(val) {
        let exp = Math.floor(Math.log10(val));
        let base = (val / Math.pow(10, exp)).toFixed(2);
        return { base, exp };
    }

    function switchCat(cat) {
        currentCat = cat;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + cat).classList.add('active');
        const imgMap = { boyle: 1, gay: 2, charles: 3, egyesitett: 4 };
        document.getElementById('theory-pic').src = `elmelet${imgMap[cat]}.jpg`;
        generateTask();
    }

    function generateTask() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('solution-box').style.display = 'none';
        let vals = {}, keys = [], desc = "", steps = "";

        if (currentCat === 'boyle') {
            keys = ['p1', 'V1', 'p2', 'V2'];
            vals.p1 = (Math.random() * 8 + 1) * 100000;
            vals.V1 = Math.random() * 15 + 2;
            vals.V2 = Math.random() * 15 + 2;
            vals.p2 = (vals.p1 * vals.V1) / vals.V2;
            desc = "Izoterm folyamat (T = állandó). A gáz nyomása és térfogata változik.";
        } else if (currentCat === 'gay') {
            keys = ['V1', 'T1', 'V2', 'T2'];
            vals.V1 = Math.random() * 10 + 1;
            vals.T1 = Math.floor(Math.random() * 100) + 250;
            vals.T2 = Math.floor(Math.random() * 250) + 250;
            vals.V2 = (vals.V1 * vals.T2) / vals.T1;
            desc = "Izobár folyamat (p = állandó). A gáz térfogata és hőmérséklete változik.";
        } else if (currentCat === 'charles') {
            keys = ['p1', 'T1', 'p2', 'T2'];
            vals.p1 = (Math.random() * 5 + 1) * 100000;
            vals.T1 = Math.floor(Math.random() * 100) + 200;
            vals.T2 = Math.floor(Math.random() * 300) + 300;
            vals.p2 = (vals.p1 * vals.T2) / vals.T1;
            desc = "Izochor folyamat (V = állandó). A gáz nyomása és hőmérséklete változik.";
        } else {
            keys = ['p1', 'V1', 'T1', 'p2', 'V2', 'T2'];
            vals.p1 = (Math.random() * 4 + 1) * 100000;
            vals.V1 = Math.random() * 5 + 1;
            vals.T1 = Math.floor(Math.random() * 100) + 270;
            vals.p2 = (Math.random() * 4 + 1) * 100000;
            vals.V2 = Math.random() * 5 + 1;
            vals.T2 = (vals.p2 * vals.V2 * vals.T1) / (vals.p1 * vals.V1);
            desc = "Egyesített gáztörvény: a gáz minden állapothatározója változik.";
        }

        currentTask.targetKey = keys[Math.floor(Math.random() * keys.length)];
        currentTask.vals = vals;
        currentTask.steps = createStepString(currentCat, vals, currentTask.targetKey);
        
        document.getElementById('task-desc').innerHTML = `<b>Feladat:</b> ${desc}<br>Számítsd ki: <b>${labels[currentTask.targetKey]}</b>`;
        renderInputs(keys);
    }

    function createStepString(cat, v, target) {
        let s = "1. Képlet:\n";
        if(cat === 'boyle') s += "   p1 · V1 = p2 · V2\n2. Behelyettesítés:\n";
        else if(cat === 'gay') s += "   V1 / T1 = V2 / T2\n2. Behelyettesítés:\n";
        else if(cat === 'charles') s += "   p1 / T1 = p2 / T2\n2. Behelyettesítés:\n";
        else s += "   (p1 · V1) / T1 = (p2 · V2) / T2\n2. Behelyettesítés:\n";

        // Dinamikus behelyettesítés generálása (egyszerűsítve az olvashatóságért)
        s += `   Keresett változó: ${labels[target]}\n`;
        s += `   Kiszámított pontos érték: ${v[target].toFixed(4)}`;
        return s;
    }

    function renderInputs(keys) {
        const container = document.getElementById('input-fields');
        container.innerHTML = '';
        keys.forEach(key => {
            const div = document.createElement('div');
            div.className = 'input-group';
            if (key === currentTask.targetKey) {
                let inputHTML = key.startsWith('p') ? 
                    `<div class="p-input"><input id="ans-b"> · 10<sup><input id="ans-e" style="width:40px"></sup> Pa</div>` :
                    `<input id="ans-val" type="number" step="0.01"> ${units[key.charAt(0)]}`;
                div.innerHTML = `<span><b>${labels[key]}:</b></span> ${inputHTML}`;
            } else {
                let display = key.startsWith('p') ? 
                    `${toNormal(currentTask.vals[key]).base} · 10<sup>${toNormal(currentTask.vals[key]).exp}</sup> Pa` : 
                    `${currentTask.vals[key].toFixed(2)} ${units[key.charAt(0)]}`;
                div.innerHTML = `<span>${labels[key]}:</span> <span class="given-val">${display}</span>`;
            }
            container.appendChild(div);
        });
    }

    function checkAnswers() {
        let userVal;
        const targetVal = currentTask.vals[currentTask.targetKey];
        
        if (currentTask.targetKey.startsWith('p')) {
            const b = parseFloat(document.getElementById('ans-b').value);
            const e = parseInt(document.getElementById('ans-e').value);
            userVal = b * Math.pow(10, e);
        } else {
            userVal = parseFloat(document.getElementById('ans-val').value);
        }

        const diff = Math.abs(userVal - targetVal) / targetVal;
        const f = document.getElementById('feedback');

        if (diff < 0.03) { // 3%-os hibahatár
            f.innerText = "Helyes! Szép munka. ✓"; f.style.color = "#4caf50";
        } else {
            f.innerText = "Nem jó. Ellenőrizd a számítást!"; f.style.color = "#f44336";
        }
    }

    function showSolution() {
        const box = document.getElementById('solution-box');
        box.innerText = currentTask.steps;
        box.style.display = 'block';
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('exam-timer').style.display = m === 'exam' ? 'block' : 'none';
        generateTask();
    }

    generateTask();
</script>
</body>
</html>
