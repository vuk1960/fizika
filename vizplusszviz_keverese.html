<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Mester - Fázisátalakulások és Hőkeverés</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; padding: 20px; background: #eceff1; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 0.9em; }
        .nav-btn.active { background: #00796b; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }

        .theory-box { background: #e0f2f1; padding: 15px; border-left: 6px solid #00796b; border-radius: 6px; margin-bottom: 20px; display: none; line-height: 1.5; }
        .theory-btn { background: #ff9800; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }

        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 250px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; max-width: 600px; align-items: center; }
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .step-box { background: #e2f1f8; padding: 12px 15px; border-left: 4px solid #0288d1; margin-bottom: 10px; border-radius: 4px; line-height: 1.5; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 5px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        
        .chart-container { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .chart-axis { stroke: #333; stroke-width: 2; }
        .chart-grid { stroke: #e0e0e0; stroke-dasharray: 4; }
        .chart-line { stroke-width: 3; fill: none; }
        .chart-text { font-size: 11px; fill: #555; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Hőtan: Tea és Víz hőkeverése fázisátalakulással</h1>
    
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (Jegyre)</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-cat1" onclick="switchCat('cat1')">1. Szint<br>(Meleg tea + Hideg víz)</button>
        <button class="nav-btn" id="btn-cat2" onclick="switchCat('cat2')">2. Szint<br>(Meleg tea + 0°C-os jég)</button>
        <button class="nav-btn" id="btn-cat3" onclick="switchCat('cat3')">3. Szint<br>(Meleg tea + -X°C-os jég)</button>
        <button class="nav-btn" id="btn-cat4" onclick="switchCat('cat4')">4. Szint<br>(Hideg tea + Vízgőz)</button>
    </div>

    <button class="theory-btn" onclick="toggleTheory()">📖 Elméleti konstansok & összefoglaló</button>
    <div id="theory-text" class="theory-box"></div>

    <div class="exercise-area">
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;"></div>
        
        <div id="inputs-container"></div>
        
        <div id="controls">
            <button class="action-btn" id="check-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Megoldás levezetése</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
        
        <div id="chart-area" class="chart-container" style="display:none;">
            <h3>Hőmérséklet alakulása a leadott/felvett hőmennyiség (Q) függvényében</h3>
            <div id="svg-holder"></div>
        </div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    // Globális változók és fizikai állandók
    let appMode = 'gyak', currentCat = 'cat1', currentTaskData = {}, solSeen = false;
    let examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }, examDone = { cat1: false, cat2: false, cat3: false, cat4: false };
    let seconds = 0, timerInterval;

    const c_viz = 4.2;    // kJ/(kg*°C)
    const c_jeg = 2.1;    // kJ/(kg*°C)
    const Lo = 334;       // Olvadáshő (kJ/kg)
    const Lf = 2260;      // Forráshő/Lecsapódáshő (kJ/kg)

    const theoryData = {
        cat1: "<b>1. Szint: Fázisátalakulás nélküli keveredés</b><br>Mivel mindkét anyag folyékony víz, nincs halmazállapot-változás.<br>Energiamérleg: <i>Q_felvett = Q_leadott</i>, azaz: <i>c_viz · m_hideg · (T_k - T_hideg) = c_viz · m_meleg · (T_meleg - T_k)</i>.",
        cat2: "<b>2. Szint: Meleg tea és 0 °C-os jégkocka</b><br>A jégkocka először megolvadt 0 °C-on (<i>Q_olv = m_jég · Lo</i>), majd a keletkezett víz felmelegszik a közös <i>T_k</i> hőmérsékletre. Ha a tea nem bírja megolvasztani az összes jeget, a véghőmérséklet pontosan 0 °C marad.",
        cat3: "<b>3. Szint: Meleg tea és negatív (-X °C) hőmérsékletű jég</b><br>A jég először felmelegszik 0 °C-ra (<i>c_jeg · m_jeg · ΔT</i>), utána megolvad, majd felmelegszik. Extrem esetben a tea annyira lehűlhet, hogy maga a tea is elkezd megfagyni!",
        cat4: "<b>4. Szint: Hideg tea és 100 °C-os vízgőz</b><br>A vízgőz először lecsapódik 100 °C-on folyékony vízzé (<i>Q_lecs = m_gőz · Lf</i>), majd a forró víz lehűl a közös hőmérsékletre. Ha sok a gőz, akár fel is forralhatja a teát!"
    };

    function fmt(x, d = 1) { return Number(x).toLocaleString('hu-HU', { minimumFractionDigits: 0, maximumFractionDigits: d }); }

    function toggleTheory() {
        const box = document.getElementById('theory-text');
        box.innerHTML = theoryData[currentCat];
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }
function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        if(m === 'felel') { resetExam(); startTimer(); } else { stopTimer(); }
        generateTask();
    }

    function startTimer() {
        stopTimer();
        seconds = 0;
        document.getElementById('exam-timer').style.display = 'block';
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('exam-timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').style.display = 'none';
    }

    function resetExam() {
        examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 };
        examDone = { cat1: false, cat2: false, cat3: false, cat4: false };
        for (let i = 1; i <= 4; i++) {
            document.getElementById(`btn-cat${i}`).className = 'nav-btn';
        }
        document.getElementById('grade-display').style.display = 'none';
    }

    function switchCat(cat) {
        currentCat = cat;
        for (let i = 1; i <= 4; i++) {
            let b = document.getElementById(`btn-cat${i}`);
            if (`cat${i}` === cat) b.classList.add('active');
            else b.classList.remove('active');
        }
        generateTask();
    }

    function generateTask() {
        solSeen = false;
        document.getElementById('feedback').innerText = '';
        document.getElementById('solution-box').style.display = 'none';
        document.getElementById('chart-area').style.display = 'none';
        
        let m_tea = parseFloat((Math.random() * 0.4 + 0.2).toFixed(2));
        let T_tea = Math.floor(Math.random() * 40) + 50;

        let steps = [];
        let questionText = "";
        let calc = {};

        if (currentCat === 'cat1') {
            let m_viz = parseFloat((Math.random() * 0.4 + 0.1).toFixed(2));
            let T_viz = Math.floor(Math.random() * 15) + 5;
            questionText = `Egy pohárba kitöltünk <b>${fmt(m_tea,2)} kg</b> tömegű, <b>${T_tea} °C</b> hőmérsékletű meleg teát. Ehhez hozzáöntünk <b>${fmt(m_viz,2)} kg</b> tömegű, <b>${T_viz} °C</b>-os hideg vizet. Mennyi lesz a közös egyensúlyi hőmérséklet?`;
            
            let Tk = (m_tea * T_tea + m_viz * T_viz) / (m_tea + m_viz);
            calc = { Tk: Tk, state: "Folyékony keverék", meltedFrac: 1, condFrac: 1 };
            
            steps.push(`Mivel nincs fázisátalakulás, felírható az egyszerűsített egyenlet: m_tea · T_tea + m_viz · T_viz = (m_tea + m_viz) · T_k`);
            steps.push(`${m_tea} · ${T_tea} + ${m_viz} · ${T_viz} = ${fmt(m_tea+m_viz,2)} · T_k`);
            steps.push(`T_k = ${fmt(m_tea * T_tea + m_viz * T_viz)} / ${fmt(m_tea + m_viz,2)} = <b>${fmt(Tk,2)} °C</b>`);

        } else if (currentCat === 'cat2') {
            let m_jeg = parseFloat((Math.random() * 0.2 + 0.05).toFixed(2));
            questionText = `<b>${fmt(m_tea,2)} kg</b> tömegű, <b>${T_tea} °C</b> hőmérsékletű teába belepottyantunk <b>${fmt(m_jeg,2)} kg</b> tömegű, pontosan <b>0 °C</b>-os jégkockát. Mennyi lesz az egyensúlyi hőmérséklet? Ha a jég nem olvad el teljesen, határozd meg a megolvadt jég tömegét!`;
            
            let Q_le_max = m_tea * c_viz * (T_tea - 0); 
            let Q_olv_szukseg = m_jeg * Lo;

            if (Q_le_max >= Q_olv_szukseg) {
                let Q_maradek = Q_le_max - Q_olv_szukseg;
                let Tk = Q_maradek / ((m_tea + m_jeg) * c_viz);
                calc = { Tk: Tk, state: "Minden jég elolvadt", meltedFrac: 1, m_olvadt: m_jeg };
                steps.push(`1. A tea maximális hőleadása 0 °C-ig lehűlve: Q_le = ${m_tea} · ${c_viz} · ${T_tea} = ${fmt(Q_le_max,1)} kJ.`);
                steps.push(`2. Az összes jég megolvasztásához szükséges hő: Q_olv = ${m_jeg} · ${Lo} = ${fmt(Q_olv_szukseg,1)} kJ.`);
                steps.push(`Mivel Q_le > Q_olv, a jég teljesen megolvad. A maradék hő melegíti a közös rendszert.`);
                steps.push(`T_k = Q_maradék / ((m_tea + m_jég) · c_víz) = <b>${fmt(Tk,2)} °C</b>.`);
            } else {
                let megolvadt = Q_le_max / Lo;
                calc = { Tk: 0, state: "Jég-víz keverék (0 °C)", meltedFrac: megolvadt/m_jeg, m_olvadt: megolvadt };
                steps.push(`1. A tea maximális hőleadása 0 °C-ig lehűlve: Q_le = ${m_tea} · ${c_viz} · ${T_tea} = ${fmt(Q_le_max,1)} kJ.`);
                steps.push(`2. Az összes jég megolvasztásához kellene: Q_olv = ${m_jeg} · ${Lo} = ${fmt(Q_olv_szukseg,1)} kJ.`);
                steps.push(`Mivel a tea nem képes az összes jeget megolvasztani, a véghőmérséklet pontosan <b>0 °C</b> marad.`);
                steps.push(`A megolvadt jég tömege: m_olvadt = Q_le / Lo = <b>${fmt(megolvadt,3)} kg</b>.`);
            }
        }
        else if (currentCat === 'cat3') {
            let m_jeg = parseFloat((Math.random() * 0.3 + 0.1).toFixed(2));
            let T_jeg = -Math.floor(Math.random() * 20 + 5); 
            questionText = `<b>${fmt(m_tea,2)} kg</b> tömegű, <b>${T_tea} °C</b>-os teába beleteszünk <b>${fmt(m_jeg,2)} kg</b> tömegű, <b>${T_jeg} °C</b>-os jeget. Határozd meg a végső egyensúlyi hőmérsékletet! Ha a jég nem olvad el teljesen, add meg a megolvadt jég tömegét!`;
            
            let Q_jeg_0ra = m_jeg * c_jeg * (0 - T_jeg);
            let Q_jeg_olv = m_jeg * Lo;
            let Q_tea_0ra = m_tea * c_viz * T_tea;

            if (Q_tea_0ra >= Q_jeg_0ra + Q_jeg_olv) {
                let Q_maradek = Q_tea_0ra - (Q_jeg_0ra + Q_jeg_olv);
                let Tk = Q_maradek / ((m_tea + m_jeg) * c_viz);
                calc = { Tk: Tk, state: "Minden jég elolvadt", meltedFrac: 1, m_olvadt: m_jeg };
                steps.push(`1. Jég felmelegítése 0 °C-ra: Q₁ = ${m_jeg} · ${c_jeg} · ${Math.abs(T_jeg)} = ${fmt(Q_jeg_0ra,1)} kJ.`);
                steps.push(`2. Jég megolvasztása: Q₂ = ${m_jeg} · ${Lo} = ${fmt(Q_jeg_olv,1)} kJ. Összesen kell: ${fmt(Q_jeg_0ra+Q_jeg_olv,1)} kJ.`);
                steps.push(`3. A tea max energiája 0 fokig: Q_tea = ${m_tea} · ${c_viz} · ${T_tea} = ${fmt(Q_tea_0ra,1)} kJ.`);
                steps.push(`Mivel a tea energiája több, a jég teljesen megolvad és a rendszer felmelegszik.`);
                steps.push(`T_k = (Q_tea - Q₁ - Q₂) / (m_összes · c_víz) = <b>${fmt(Tk,2)} °C</b>.`);
            } else if (Q_tea_0ra > Q_jeg_0ra) {
                let Q_marad_olvasztasra = Q_tea_0ra - Q_jeg_0ra;
                let m_olv = Q_marad_olvasztasra / Lo;
                calc = { Tk: 0, state: "0 fokos jég+víz keverék", meltedFrac: m_olv/m_jeg, m_olvadt: m_olv };
                steps.push(`1. Jég felmelegítése 0 °C-ra: Q₁ = ${fmt(Q_jeg_0ra,1)} kJ.`);
                steps.push(`2. A tea maximum leadható hője: ${fmt(Q_tea_0ra,1)} kJ.`);
                steps.push(`A jég felmelegszik 0 fokra, de csak részben olvad meg. A véghőmérséklet: T_k = <b>0 °C</b>.`);
                steps.push(`Megolvadt rész tömege: m_olvadt = ${fmt(Q_marad_olvasztasra,1)} / ${Lo} = <b>${fmt(m_olv,3)} kg</b>.`);
            } else {
                let Q_hianyzik = Q_jeg_0ra - Q_tea_0ra;
                let m_tea_megfagy = Q_hianyzik / Lo;
                if(m_tea_megfagy > m_tea) {
                    let Tk_szilard = (Q_tea_0ra + m_tea*Lo - Q_jeg_0ra) / (m_jeg*c_jeg + m_tea*c_jeg); 
                    calc = { Tk: Tk_szilard, state: "Teljesen megfagyott minden", meltedFrac:0, m_olvadt:0 };
                    steps.push(`Extrém eset! A tea teljesen megfagyott és a jéggel együtt 0 fok alá hűlt: T_k = <b>${fmt(Tk_szilard,2)} °C</b>.`);
                } else {
                    calc = { Tk: 0, state: "A tea egy része megfagyott!", meltedFrac: 0, m_olvadt: 0, m_fagyott_tea: m_tea_megfagy };
                    steps.push(`Drasztikus lehűlés! A tea teljesen leadta a hőjét, elérte a 0 °C-ot, sőt egy része (${fmt(m_tea_megfagy,3)} kg) meg is fagyott, hogy a jeget 0 fokra melegítse!`);
                    steps.push(`A végső hőmérséklet így pontosan: <b>0 °C</b> (és a megolvadt jég tömege 0 kg).`);
                }
            }

        } else if (currentCat === 'cat4') {
            T_tea = Math.floor(Math.random() * 15) + 5; 
            let m_goz = parseFloat((Math.random() * 0.03 + 0.01).toFixed(3)); 
            questionText = `<b>${fmt(m_tea,2)} kg</b> tömegű, <b>${T_tea} °C</b> hőmérsékletű hideg teába <b>${fmt(m_goz,3)} kg</b> tömegű, <b>100 °C</b>-os vízgőzt vezetünk be. Mennyi lesz a közös egyensúlyi hőmérséklet a lecsapódás után?`;
            
            let Q_gőz_lecsap = m_goz * Lf;
            let Q_tea_forr_fel = m_tea * c_viz * (100 - T_tea);

            if (Q_gőz_lecsap <= Q_tea_forr_fel) {
                let Tk = (Q_gőz_lecsap + m_goz*c_viz*100 + m_tea*c_viz*T_tea) / ((m_tea + m_goz) * c_viz);
                calc = { Tk: Tk, state: "Folyékony meleg víz", meltedFrac: 1, condFrac: 1 };
                steps.push(`1. A gőz lecsapódásakor felszabaduló hő: Q_lecs = ${m_goz} · ${Lf} = ${fmt(Q_gőz_lecsap,1)} kJ.`);
                steps.push(`2. Energiamérleg egyenlet: m_gőz·Lf + m_gőz·c_víz·(100 - T_k) = m_tea·c_víz·(T_k - T_tea)`);
                steps.push(`Átrendezve kapjuk az egyensúlyi hőmérsékletet: T_k = <b>${fmt(Tk,2)} °C</b>.`);
            } else {
                calc = { Tk: 100, state: "Forrásban lévő víz (100 °C)", meltedFrac: 1, condFrac: 1 };
                steps.push(`A bevezetett gőz annyi hőt közöl, hogy a keverék eléri a 100 °C-os forráspontot! T_k = <b>100 °C</b>.`);
            }
        }

        currentTaskData = calc;
        currentTaskData.steps = steps;
        
        document.getElementById('exercise-text').innerHTML = questionText;
        buildInputs();
    }

    function buildInputs() {
        let container = document.getElementById('inputs-container');
        container.innerHTML = "";

        let div1 = document.createElement('div');
        div1.className = "input-row";
        div1.innerHTML = `<label>Végső egyensúlyi hőmérséklet (°C):</label>
                          <input type="number" id="ans-tk" step="0.1" placeholder="pl. 24.5">`;
        container.appendChild(div1);

        if (currentCat === 'cat2' || currentCat === 'cat3') {
            let div2 = document.createElement('div');
            div2.className = "input-row";
            div2.innerHTML = `<label>A jégből megolvadt mennyiség (kg):<br><small>(Ha az összes elolvadt, írd be a jég eredeti tömegét)</small></label>
                              <input type="number" id="ans-molv" step="0.001" placeholder="pl. 0.12">`;
            container.appendChild(div2);
        }
    }
    function checkAnswers() {
        let userTk = parseFloat(document.getElementById('ans-tk').value);
        let correct = true;

        if (isNaN(userTk) || Math.abs(userTk - currentTaskData.Tk) > 0.5) {
            correct = false;
        }

        if (currentCat === 'cat2' || currentCat === 'cat3') {
            let userMolv = parseFloat(document.getElementById('ans-molv').value);
            let targetMolv = currentTaskData.m_olvadt || 0;
            if (isNaN(userMolv) || Math.abs(userMolv - targetMolv) > 0.01) {
                correct = false;
            }
        }

        let feedbackZone = document.getElementById('feedback');
        if (correct) {
            feedbackZone.innerHTML = "<span style='color:green;'>Helyes válasz! Szép munka! 🎉</span>";
            if (appMode === 'felel' && !examDone[currentCat]) {
                examScore[currentCat] = solSeen ? 1 : 5;
                examDone[currentCat] = true;
                document.getElementById(`btn-${currentCat}`).classList.add('completed');
                checkExamEnd();
            }
        } else {
            feedbackZone.innerHTML = "<span style='color:red;'>Sajnos a válasz nem pontos vagy hibás. Nézd át a levezetést! ❌</span>";
            if (appMode === 'felel' && !examDone[currentCat]) {
                examScore[currentCat] = 1;
                examDone[currentCat] = true;
                document.getElementById(`btn-${currentCat}`).classList.add('completed');
                checkExamEnd();
            }
        }
    }

    function checkExamEnd() {
        if (examDone.cat1 && examDone.cat2 && examDone.cat3 && examDone.cat4) {
            stopTimer();
            let sum = examScore.cat1 + examScore.cat2 + examScore.cat3 + examScore.cat4;
            let avg = Math.round(sum / 4);
            let display = document.getElementById('grade-display');
            display.style.display = 'block';
            display.innerHTML = `<h2>Felelés Értékelése</h2>
                                 <p>1. Szint: ${examScore.cat1} | 2. Szint: ${examScore.cat2} | 3. Szint: ${examScore.cat3} | 4. Szint: ${examScore.cat4}</p>
                                 <h1 style="font-size:3em; color:#1a237e;">Vizsga Jegy: ${avg}</h1>
                                 <p>Időtartam: ${document.getElementById('exam-timer').innerText}</p>`;
        }
    }

    function showSolution() {
        solSeen = true;
        let box = document.getElementById('solution-box');
        box.innerHTML = "<h3>A megoldás részletes lépései:</h3>";
        
        currentTaskData.steps.forEach(step => {
            let p = document.createElement('div');
            p.className = "step-box";
            p.innerHTML = step;
            box.appendChild(p);
        });

        box.style.display = 'block';
        drawChart();
    }

    function drawChart() {
        document.getElementById('chart-area').style.display = 'block';
        let holder = document.getElementById('svg-holder');
        holder.innerHTML = "";

        let svg = document.createElementNS("http://w3.org", "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "220");
        svg.setAttribute("viewBox", "0 0 600 220");

        svg.innerHTML += `<line x1="50" y1="180" x2="550" y2="180" class="chart-axis" />`; 
        svg.innerHTML += `<line x1="50" y1="20" x2="50" y2="180" class="chart-axis" />`;  
        svg.innerHTML += `<text x="530" y="195" class="chart-text" font-weight="bold">Q (kJ)</text>`;
        svg.innerHTML += `<text x="15" y="25" class="chart-text" font-weight="bold">T (°C)</text>`;

        svg.innerHTML += `<line x1="50" y1="140" x2="550" y2="140" class="chart-grid" />`; 
        svg.innerHTML += `<text x="25" y="144" class="chart-text">0°C</text>`;
        svg.innerHTML += `<line x1="50" y1="40" x2="550" y2="40" class="chart-grid" />`; 
        svg.innerHTML += `<text x="20" y="44" class="chart-text">100°C</text>`;

        let y_eq = 140 - (currentTaskData.Tk * 1); 

        if (currentCat === 'cat1') {
            svg.innerHTML += `<path d="M 50 60 L 300 ${y_eq}" class="chart-line" stroke="#e53935" />`; 
            svg.innerHTML += `<path d="M 50 160 L 300 ${y_eq}" class="chart-line" stroke="#0288d1" />`; 
        } else if (currentCat === 'cat2' || currentCat === 'cat3') {
            svg.innerHTML += `<path d="M 50 60 L 400 ${y_eq}" class="chart-line" stroke="#e53935" />`; 
            svg.innerHTML += `<path d="M 50 170 L 150 140 L 300 140 L 400 ${y_eq}" class="chart-line" stroke="#0288d1" />`; 
        } else if (currentCat === 'cat4') {
            svg.innerHTML += `<path d="M 50 40 L 200 40 L 400 ${y_eq}" class="chart-line" stroke="#e53935" />`; 
            svg.innerHTML += `<path d="M 50 150 L 400 ${y_eq}" class="chart-line" stroke="#0288d1" />`; 
        }

        if (!isNaN(y_eq)) {
            let finalX = (currentCat === 'cat1') ? 300 : 400;
            svg.innerHTML += `<circle cx="${finalX}" cy="${y_eq}" r="6" fill="#1a237e" />`;
            svg.innerHTML += `<text x="${finalX + 10}" y="${y_eq - 10}" class="chart-text" font-weight="bold" fill="#1a237e">Egyensúlyi állapot: ${fmt(currentTaskData.Tk,1)} °C</text>`;
        }

        holder.appendChild(svg);
    }

    generateTask();
</script>
</body>
</html>
