<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Mozgó dugattyú szimuláció</title>
    <style>
        body { font-family: sans-serif; background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .container { background: #334155; padding: 20px; border-radius: 15px; width: 95%; max-width: 900px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #box { 
            width: 100%; height: 300px; background: #0f172a; position: relative; 
            border: 4px solid #64748b; border-radius: 8px; overflow: hidden; margin: 15px 0;
        }
        /* A mozgó fal (dugattyú) */
        #divider { 
            position: absolute; left: 50%; top: 0; width: 12px; height: 100%; 
            background: #f87171; z-index: 10; cursor: grab;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.5);
            border-left: 2px solid #b91c1c; border-right: 2px solid #b91c1c;
        }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .side-control { background: #475569; padding: 12px; border-radius: 10px; border-top: 4px solid #3498db; }
        .side-right { border-top: 4px solid #fbbf24; }
        
        .molecule { position: absolute; transform-origin: center; pointer-events: none; }
        .atom { width: 8px; height: 8px; border-radius: 50%; position: absolute; }

        .btn-group { grid-column: span 2; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .unlock-btn { background: #fbbf24; color: #1e293b; }
        .reset-btn { background: #64748b; color: white; }
        
        .results { margin-top: 15px; padding: 10px; background: #0f172a; border-radius: 8px; text-align: center; }
        b { color: #4ade80; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin:0;">Dugattyú és nomáskiegyenlítődés</h2>
     <h1 style="text-align:right; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    <div id="box">
        <div id="divider"></div>
    </div>

    <div class="controls">
        <div class="side-control">
            <strong>Bal oldal</strong><br>
            Anyagmennyiség: <input type="range" id="n1" min="0.5" max="3" step="0.1" value="1"> <span id="v_n1">1.0</span> mol<br>
            Hőmérséklet: <input type="range" id="t1" min="100" max="1000" value="300"> <span id="v_t1">300</span> K
        </div>

        <div class="side-control side-right">
            <strong>Jobb oldal</strong><br>
            Anyagmennyiség: <input type="range" id="n2" min="0.5" max="3" step="0.1" value="1"> <span id="v_n2">1.0</span> mol<br>
            Hőmérséklet: <input type="range" id="t2" min="100" max="1000" value="300"> <span id="v_t2">300</span> K
        </div>

        <div class="btn-group">
            <button id="lockBtn" class="btn unlock-btn" onclick="toggleLock()">RÖGZÍTÉS FELOLDÁSA</button>
            <button class="btn reset-btn" onclick="resetSim()">ALAPHELYZET</button>
        </div>
    </div>

    <div class="results">
        Bal nyomás: <b id="p1">-</b> | Jobb nyomás: <b id="p2">-</b><br>
        <small>A fal oda mozdul, ahol kisebb a nyomás (p = nRT / V)</small>
    </div>
</div>

<script>
    let molecules = [];
    let dividerX = 50; // Százalékban
    let isLocked = true;
    const box = document.getElementById('box');
    const divEl = document.getElementById('divider');

    function resetSim() {
        isLocked = true;
        dividerX = 50;
        divEl.style.left = '50%';
        document.getElementById('lockBtn').innerText = "RÖGZÍTÉS FELOLDÁSA";
        document.getElementById('lockBtn').style.background = "#fbbf24";
        spawnAll();
    }

    function toggleLock() {
        isLocked = !isLocked;
        document.getElementById('lockBtn').innerText = isLocked ? "RÖGZÍTÉS FELOLDÁSA" : "FAL RÖGZÍTÉSE";
        document.getElementById('lockBtn').style.background = isLocked ? "#fbbf24" : "#f87171";
    }

    function spawnAll() {
        molecules.forEach(m => m.el.remove());
        molecules = [];
        spawnSide('n1', 't1', '#3498db', true);
        spawnSide('n2', 't2', '#fbbf24', false);
    }

    function spawnSide(nid, tid, color, isLeft) {
        const n = parseFloat(document.getElementById(nid).value);
        const t = parseFloat(document.getElementById(tid).value);
        const count = n * 15;
        for(let i=0; i<count; i++) {
            const el = document.createElement('div');
            el.className = 'molecule';
            const a = document.createElement('div');
            a.className = 'atom'; a.style.background = color;
            el.appendChild(a);
            box.appendChild(el);
            molecules.push({
                el: el, x: isLeft ? Math.random()*45 : 55+Math.random()*40,
                y: Math.random()*90,
                vx: (Math.random()-0.5) * (Math.sqrt(t)/12),
                vy: (Math.random()-0.5) * (Math.sqrt(t)/12),
                isLeft: isLeft
            });
        }
    }

    function animate() {
        const n1 = parseFloat(document.getElementById('n1').value);
        const t1 = parseFloat(document.getElementById('t1').value);
        const n2 = parseFloat(document.getElementById('n2').value);
        const t2 = parseFloat(document.getElementById('t2').value);

        // Nyomás számítás (V-vel arányos a szélesség)
        let p1 = (n1 * t1) / dividerX;
        let p2 = (n2 * t2) / (100 - dividerX);

        document.getElementById('p1').innerText = p1.toFixed(2) + " j.e.";
        document.getElementById('p2').innerText = p2.toFixed(2) + " j.e.";

        if (!isLocked) {
            let force = (p1 - p2) * 0.1;
            dividerX += force;
            if(dividerX < 5) dividerX = 5;
            if(dividerX > 95) dividerX = 95;
            divEl.style.left = dividerX + '%';
        }

        molecules.forEach(m => {
            m.x += m.vx; m.y += m.vy;
            if(m.y < 2 || m.y > 95) m.vy *= -1;
            if(m.x < 1 || m.x > 98) m.vx *= -1;

            // Ütközés a mozgó fallal
            if(m.isLeft && m.x > dividerX - 2) { m.vx *= -1; m.x = dividerX - 2.1; }
            if(!m.isLeft && m.x < dividerX + 1) { m.vx *= -1; m.x = dividerX + 1.1; }

            m.el.style.left = m.x + '%';
            m.el.style.top = m.y + '%';
        });
        requestAnimationFrame(animate);
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', (e) => {
        if(e.target.id.startsWith('n') || e.target.id.startsWith('t')) {
            document.getElementById('v_' + e.target.id).innerText = parseFloat(e.target.value).toFixed(1);
            if(isLocked) spawnAll();
        }
    }));

    spawnAll();
    animate();
</script>

</body>
</html>
