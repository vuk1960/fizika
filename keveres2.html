<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Mester - Kalorimetria lépésről lépésre</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; padding: 20px; background: #eceff1; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #6a1b9a; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }

        .theory-box { background: #f3e5f5; padding: 15px; border-left: 6px solid #6a1b9a; border-radius: 6px; margin-bottom: 20px; display: none; line-height: 1.5; }
        .theory-btn { background: #ff9800; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }

        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 250px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; max-width: 600px; align-items: center; }
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .step-box { background: #e0f2f1; padding: 10px 15px; border-left: 4px solid #004d40; margin-bottom: 10px; border-radius: 4px; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 5px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        
        .chart-container { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .chart-axis { stroke: #333; stroke-width: 2; }
        .chart-grid { stroke: #e0e0e0; stroke-dasharray: 4; }
        .chart-line-water { stroke: #0288d1; stroke-width: 3; fill: none; }
        .chart-line-steam { stroke: #e53935; stroke-width: 3; fill: none; stroke-dasharray: 2; }
        .chart-text { font-size: 11px; fill: #555; }
        .chart-dot { fill: #1a237e; }
    </style>
</head>
<body>
<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Hőtan: Kalorimetria (víz+jég+ gőz)</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (Jegyre)</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-cat1" onclick="switchCat('cat1')">1. Szint (Könnyű)</button>
        <button class="nav-btn" id="btn-cat2" onclick="switchCat('cat2')">2. Szint (Közepes)</button>
        <button class="nav-btn" id="btn-cat3" onclick="switchCat('cat3')">3. Szint (Haladó)</button>
        <button class="nav-btn" id="btn-cat4" onclick="switchCat('cat4')">4. Szint (Összetett)</button>
    </div>

    <button class="theory-btn" onclick="toggleTheory()">📖 Elméleti összefoglaló és a logikai bukfenc</button>
    <div id="theory-text" class="theory-box"></div>

    <div class="exercise-area">
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;"></div>
        
        <div id="inputs-container"></div>
        
        <div id="controls">
            <button class="action-btn" id="check-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Megoldás levezetése</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
        
        <div id="chart-area" class="chart-container" style="display:none;">
            <h3>Folyamat-vizualizáció (T - Q diagram)</h3>
            <div id="svg-holder"></div>
        </div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', currentCat = 'cat1', currentTaskData = {}, solSeen = false;
    let examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }, examDone = { cat1: false, cat2: false, cat3: false, cat4: false };
    let seconds = 0, timerInterval;

    const c_ice = 2.1;   
    const L_fus = 334;   
    const c_water = 4.2; 
    const L_vap = 2260;  
    const c_steam = 2.0; 

    const theoryData = {
        cat1: "<b>Közös halmazállapot váltás nélkül:</b> Mivel mindkét komponens folyékony víz, biztos, hogy a közös hőmérséklet a kettő között lesz. Alapegyenlet: <i>Q_felvett = Q_leadott</i>.",
        cat2: "<b>A Logikai bukfenc (Víz + Jég 0°C):</b> Vajon elolvad az összes jég? <br>1. Számoljuk ki, mennyi hőt adna le a víz, ha lehűlne 0 °C-ra (<i>Q_max_leadott</i>).<br>2. Számoljuk ki, mennyi hő kell az összes jég megolvasztásához (<i>Q_szükséges</i>).<br>Ha a leadható hő több, a jég mind elolvad, és a víz 0 °C fölé melegszik!",
        cat3: "<b>Összetett jéghatás (-10°C):</b> A jégnek előbb fel kell melegednie 0 °C-ra, majd megolvadnia. Lépésenként mérni kell az energiatartalékot, különben hibás egyenletet írunk fel!",
        cat4: "<b>Gőzbefúvás (100°C):</b> A gőz lecsapódása (2260 kJ/kg) hatalmas energiát szabadít fel. Meg kell nézni, hogy a hideg víz 100 °C-ra melegítése több vagy kevesebb energiát igényel-e, mint a gőz teljes lecsapódása."
    };

    function fmt(x, d = 1) { return Number(x).toLocaleString('hu-HU', { minimumFractionDigits: 0, maximumFractionDigits: d }); }
    function toggleTheory() { const box = document.getElementById('theory-text'); box.innerHTML = theoryData[currentCat]; box.style.display = (box.style.display === 'block') ? 'none' : 'block'; }
    function setMode(m) { appMode = m; document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : ''); document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : ''); resetExam(); if(m === 'felel') startTimer(); else stopTimer(); generateTask(); }
    function startTimer() { seconds = 0; document.getElementById('exam-timer').style.display = 'block'; clearInterval(timerInterval); timerInterval = setInterval(() => { seconds++; let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0'); document.getElementById('exam-timer').innerText = `${m}:${s}`; }, 1000); }
    function stopTimer() { clearInterval(timerInterval); document.getElementById('exam-timer').style.display = 'none'; }
    function resetExam() { examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }; examDone = { cat1: false, cat2: false, cat3: false, cat4: false }; document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('completed')); document.getElementById('grade-display').style.display = 'none'; }
    function switchCat(cat) { currentCat = cat; document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-' + cat).classList.add('active'); if(document.getElementById('theory-text').style.display === 'block') toggleTheory(); generateTask(); }
    function generateTask() {
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('solution-box').style.display = 'none';
        solSeen = false;

        let m1 = Math.floor(Math.random() * 3) + 2; 
        let t1, m2, t2;
        
        if (currentCat === 'cat1') {
            t1 = Math.floor(Math.random() * 20) + 10; m2 = Math.floor(Math.random() * 2) + 1; t2 = Math.floor(Math.random() * 30) + 60;
        } else if (currentCat === 'cat2') {
            t1 = Math.floor(Math.random() * 30) + 40; m2 = 0.5; t2 = 0; 
        } else if (currentCat === 'cat3') {
            t1 = Math.floor(Math.random() * 30) + 50; m2 = 0.4; t2 = -15;
        } else {
            t1 = Math.floor(Math.random() * 20) + 10; m2 = 0.15; t2 = 100;
        }

        calculateMix(m1, t1, m2, t2);
        if (appMode === 'gyak') { document.getElementById('chart-area').style.display = 'block'; drawChart(); } 
        else { document.getElementById('chart-area').style.display = 'none'; }
    }

    function calculateMix(m1, t1, m2, t2) {
        let tk = 0; let stepsText = []; let inputsHtml = "";
        
        if (currentCat === 'cat1') {
            tk = (m1 * t1 + m2 * t2) / (m1 + m2);
            inputsHtml += `<div class="input-row"><label>1. Felvett hő kifejezése (c·m₁·(T_k - T₁)) [kJ]:</label><input type="text" id="in-q1"></div>`;
            inputsHtml += `<div class="input-row"><label>2. Leadott hő kifejezése (c·m₂·(T₂ - T_k)) [kJ]:</label><input type="text" id="in-q2"></div>`;
            stepsText.push(`Mivel mindkét anyag víz, nincs halmazállapot-változás. Felírható: Q_fel = Q_le`);
            stepsText.push(`4,2 · ${m1} · (T_k - ${t1}) = 4,2 · ${m2} · (${t2} - T_k)`);
        } 
        else if (currentCat === 'cat2' || currentCat === 'cat3') {
            let q_ice_warm = currentCat === 'cat3' ? c_ice * m2 * (0 - t2) : 0;
            let q_melt = L_fus * m2;
            let q_max_le = c_water * m1 * (t1 - 0);
            
            inputsHtml += `<div class="input-row"><label>1. Víz által 0°C-ig leadható max. hő [kJ]:</label><input type="text" id="in-qmax"></div>`;
            inputsHtml += `<div class="input-row"><label>2. Jég teljes megolvadásához szükséges hő [kJ]:</label><input type="text" id="in-qneed"></div>`;
            
            if (q_max_le > (q_ice_warm + q_melt)) {
                tk = (c_water * m1 * t1 - q_ice_warm - q_melt) / (c_water * (m1 + m2));
                stepsText.push(`<b>Logikai vizsgálat:</b> A meleg víz 0°C-ra hűlése közben leadható energia (${fmt(q_max_le)} kJ) TÖBB, mint ami a jég felmelegítéséhez és teljes megolvasztásához kell (${fmt(q_ice_warm + q_melt)} kJ).`);
                stepsText.push(`<b>Következtetés:</b> A jég teljesen elolvad, a közös hőmérséklet 0 °C felett lesz.`);
                stepsText.push(`<b>Végső egyenlet:</b> Q_jég_melegít + Q_olvadás + Q_víz_melegít = Q_melegvíz_lehűl`);
            }
        }
        else if (currentCat === 'cat4') {
            let q_condense = L_vap * m2;
            let q_water_max_up = c_water * m1 * (100 - t1);
            inputsHtml += `<div class="input-row"><label>1. Hideg víz 100°C-ra melegítésének hőigénye [kJ]:</label><input type="text" id="in-qmax"></div>`;
            inputsHtml += `<div class="input-row"><label>2. Gőz lecsapódásakor felszabaduló hő [kJ]:</label><input type="text" id="in-qneed"></div>`;
            
            tk = (q_condense + c_water * m2 * 100 + c_water * m1 * t1) / (c_water * (m1 + m2));
            stepsText.push(`<b>Logikai vizsgálat:</b> A gőz lecsapódása önmagában ${fmt(q_condense)} kJ hőt termel. Ez kevesebb vagy több, mint a víz felforralásához szükséges hő?`);
        }

        tk = Math.round(tk * 100) / 100;
        inputsHtml += `<div class="input-row" style="border-top:2px solid #1a237e; padding-top:10px;"><label><b>Végső közös hőmérséklet (T_közös) [°C]:</b></label><input type="text" id="in-tk"></div>`;
        
        currentTaskData = { m1: m1, t1: t1, m2: m2, t2: t2, tk: tk, stepsText: stepsText };
        
        let intro = `Egy kaloriméterben lévő <b>${m1} kg</b> tömegű, <b>${t1} °C</b>-os vízbe beleteszünk <b>${m2} kg</b> tömegű, <b>${t2} °C</b>-os összetevőt. Határozza meg a folyamatot lépésenként!`;
        document.getElementById('exercise-text').innerHTML = intro;
        document.getElementById('inputs-container').innerHTML = inputsHtml;
    }

    function checkAnswers() {
        let userTk = parseFloat(document.getElementById('in-tk').value.replace(',','.'));
        let tkEl = document.getElementById('in-tk');
        
        if(Math.abs(userTk - currentTaskData.tk) < 0.5) {
            tkEl.style.borderColor = "green";
            document.getElementById('feedback').innerHTML = "<span style='color:green;'>✓ Helyes megoldás!</span>";
        } else {
            tkEl.style.borderColor = "red";
            document.getElementById('feedback').innerHTML = "<span style='color:red;'>✗ A számított közös hőmérséklet nem pontos.</span>";
        }
    }

    function showSolution() {
        let d = currentTaskData;
        let html = "<h4>Lépésenkénti logikai levezetés:</h4>";
        d.stepsText.forEach(s => { html += `<div class="step-box">${s}</div>`; });
        html += `<p style='font-size:1.3em; color:#1a237e;'><b>Közös egyensúlyi hőmérséklet az egyenlet rendezése után: T_k = ${fmt(d.tk, 2)} °C</b></p>`;
        document.getElementById('solution-box').innerHTML = html;
        document.getElementById('solution-box').style.display = 'block';
    }

    function drawChart() {
        const d = currentTaskData; const w = 500, h = 250, padX = 50, padY = 30;
        let svg = `<svg width="${w}" height="${h}" style="background:#fafafa; border:1px solid #ccc;">`;
        svg += `<line x1="${padX}" y1="${h-padY}" x2="${w-padX}" y2="${h-padY}" class="chart-axis" />`;
        svg += `<line x1="${padX}" y1="${padY}" x2="${padX}" y2="${h-padY}" class="chart-axis" />`;
        svg += `<text x="${w-padX}" y="${h-padY+15}" class="chart-text">Idő / Folyamat</text>`;
        svg += `<text x="${padX+5}" y="${padY+10}" class="chart-text" font-weight="bold">T (°C)</text></svg>`;
        document.getElementById('svg-holder').innerHTML = svg;
    }

    generateTask();
</script>
</body>
</html>
