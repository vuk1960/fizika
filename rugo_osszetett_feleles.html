<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika Mester - Összetett Rugófeladatok</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .theory-box { background: #e3f2fd; padding: 15px; border-left: 6px solid #2196f3; border-radius: 6px; margin-bottom: 20px; line-height: 1.5; }
        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 300px; position: relative; }
        
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; margin: 10px 0; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 10px; }
        .progress { margin-bottom: 10px; font-weight: bold; color: #1a237e; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        .highlight { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <div class="header-area">
    <h1 style="text-align:center; color: #1a237e;">Összetett feladatok rugóval</h1>
    <a href="index2.html">← Vissza az összefoglaló oldalra</a>
    </div> 
  
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (3 feladat)</button>
    </div>

    <div id="theory-section" class="theory-box">
        <b>Elméleti segítség:</b> A rugóállandó (<b>D</b>) a rugó sajátossága, nem változik! <br>
        1. Az első adatokból számold ki: <b>D = F<sub>1</sub> / Δx<sub>1</sub></b> <br>
        2. Ezt a <b>D</b> értéket használd a második állapot kiszámításához (<b>F<sub>2</sub> = D · Δx<sub>2</sub></b> vagy <b>Δx<sub>2</sub> = F<sub>2</sub> / D</b>).
    </div>

    <div class="exercise-area">
        <div id="progress-text" class="progress" style="display:none;">Feladat: 1 / 3</div>
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.5;"></div>
        
        <div id="input-container">
            <span id="label-text"></span>: <input type="number" id="user-ans" step="any"> <span id="unit-text"></span>
        </div>

        <div id="controls" style="margin-top: 20px;">
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" id="new-btn" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Súgó / Megoldás</button>
        </div>

        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
    </div>

    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', currentTask = {}, solSeen = false, examStep = 0, examPoints = 0;
    let seconds = 0, timerInterval;

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        
        if(m === 'felel') {
            startExam();
        } else {
            stopTimer();
            document.getElementById('progress-text').style.display = 'none';
            document.getElementById('grade-display').style.display = 'none';
            generateTask();
        }
    }

    function startExam() {
        examStep = 1;
        examPoints = 0;
        seconds = 0;
        document.getElementById('exam-timer').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        document.getElementById('grade-display').style.display = 'none';
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
        generateTask();
    }

    function updateTimer() {
        seconds++;
        let m = Math.floor(seconds/60).toString().padStart(2,'0');
        let s = (seconds%60).toString().padStart(2,'0');
        document.getElementById('exam-timer').innerText = `${m}:${s}`;
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('exam-timer').style.display = 'none';
    }

    function generateTask() {
        solSeen = false;
        document.getElementById('feedback').innerText = "";
        document.getElementById('solution-box').style.display = "none";
        document.getElementById('user-ans').value = "";
        document.getElementById('progress-text').innerText = `Feladat: ${examStep} / 3`;

        const D = (Math.floor(Math.random() * 10) + 2) * 50; 
        const dx1_cm = (Math.floor(Math.random() * 15) + 5); 
        const F1 = D * (dx1_cm / 100);
        const type = Math.random() > 0.5 ? 'F' : 'x';

        if (type === 'F') {
            const dx2_cm = dx1_cm + 10;
            currentTask = { 
                ans: D * (dx2_cm / 100), 
                unit: "N", 
                label: "Második erő (F₂)",
                text: `Egy rugót <span class="highlight">${F1.toFixed(1)} N</span> erővel húzva a megnyúlása <span class="highlight">${dx1_cm} cm</span>. <br> Mekkora erő szükséges ahhoz, hogy ugyanez a rugó <span class="highlight">${dx2_cm} cm</span>-t nyúljon meg?`,
                step: `1. D = F<sub>1</sub> / Δx<sub>1</sub> = ${F1.toFixed(1)} / ${(dx1_cm/100)} = ${D} N/m. <br> 2. F<sub>2</sub> = D · Δx<sub>2</sub> = ${D} · ${(dx2_cm/100)} = ${(D*(dx2_cm/100)).toFixed(1)} N.`
            };
        } else {
            const F2 = F1 * 2;
            currentTask = { 
                ans: (F2 / D) * 100, 
                unit: "cm", 
                label: "Második megnyúlás (Δx₂)",
                text: `Egy rugóra <span class="highlight">${F1.toFixed(1)} N</span> erőt akasztunk, ekkor <span class="highlight">${dx1_cm} cm</span>-t nyúlik meg. <br> Hány <span class="highlight">centimétert</span> nyúlik meg, ha az erőt <span class="highlight">${F2.toFixed(1)} N</span>-ra növeljük?`,
                step: `1. D = F<sub>1</sub> / Δx<sub>1</sub> = ${D} N/m. <br> 2. Δx<sub>2</sub> = F<sub>2</sub> / D = ${F2.toFixed(1)} / ${D} = ${(F2/D).toFixed(3)} m. <br> 3. Átváltva: ${((F2/D)*100).toFixed(1)} cm.`
            };
        }

        document.getElementById('exercise-text').innerHTML = currentTask.text;
        document.getElementById('label-text').innerText = currentTask.label;
        document.getElementById('unit-text').innerText = currentTask.unit;
    }

    function checkAnswer() {
        const val = parseFloat(document.getElementById('user-ans').value);
        if (Math.abs(val - currentTask.ans) < 0.1) {
            document.getElementById('feedback').innerHTML = "✅ Helyes!";
            document.getElementById('feedback').style.color = "green";
            
            if(appMode === 'felel') {
                if(!solSeen) examPoints++;
                if(examStep < 3) {
                    examStep++;
                    setTimeout(generateTask, 1000);
                } else {
                    finishExam();
                }
            }
        } else {
            document.getElementById('feedback').innerHTML = "❌ Próbáld újra!";
            document.getElementById('feedback').style.color = "red";
        }
    }

    function showSolution() {
        solSeen = true;
        document.getElementById('solution-box').innerHTML = `<b>Levezetés:</b><br>${currentTask.step}`;
        document.getElementById('solution-box').style.display = "block";
    }

    function finishExam() {
        stopTimer();
        const grade = examPoints === 3 ? 5 : examPoints === 2 ? 3 : 1;
        const gBox = document.getElementById('grade-display');
        gBox.style.display = "block";
        gBox.innerHTML = `
            <h2>Felelés vége</h2>
            <p>Helyes megoldások (súgó nélkül): ${examPoints} / 3</p>
            <h1 style="font-size: 3em;">Jegy: ${grade}</h1>
            <p>Idő: ${document.getElementById('exam-timer').innerText}</p>
            <button class="action-btn" onclick="startExam()">Újra</button>
        `;
    }

    generateTask();
</script>

</body>
</html>
