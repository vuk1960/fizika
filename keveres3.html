<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Mester - Különböző anyagok hőkeverése</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 950px; margin: 20px auto; padding: 20px; background: #eceff1; color: #333; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .nav-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #00796b; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }

        .theory-box { background: #e0f2f1; padding: 15px; border-left: 6px solid #00796b; border-radius: 6px; margin-bottom: 20px; display: none; line-height: 1.5; }
        .theory-btn { background: #ff9800; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }

        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 250px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; max-width: 600px; align-items: center; }
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .step-box { background: #e2f1f8; padding: 12px 15px; border-left: 4px solid #0288d1; margin-bottom: 10px; border-radius: 4px; line-height: 1.5; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 5px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
        
        .chart-container { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .chart-axis { stroke: #333; stroke-width: 2; }
        .chart-grid { stroke: #e0e0e0; stroke-dasharray: 4; }
        .chart-line-solid { stroke: #0288d1; stroke-width: 3; fill: none; }
        .chart-line-dash { stroke: #e53935; stroke-width: 3; fill: none; stroke-dasharray: 4; }
        .chart-text { font-size: 11px; fill: #555; }
        .chart-dot { fill: #1a237e; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Hőtan: Különböző anyagok hőkeverése</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a főoldalra</a></h1>
    
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (Jegyre)</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-cat1" onclick="switchCat('cat1')">1. Szint (Víz + Alumínium)</button>
        <button class="nav-btn" id="btn-cat2" onclick="switchCat('cat2')">2. Szint (Víz + Réz)</button>
        <button class="nav-btn" id="btn-cat3" onclick="switchCat('cat3')">3. Szint (Víz + Vas)</button>
        <button class="nav-btn" id="btn-cat4" onclick="switchCat('cat4')">4. Szint (Véletlenszerű)</button>
    </div>

    <button class="theory-btn" onclick="toggleTheory()">📖 Elméleti összefoglaló</button>
    <div id="theory-text" class="theory-box"></div>

    <div class="exercise-area">
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;"></div>
        
        <div id="inputs-container"></div>
        
        <div id="controls">
            <button class="action-btn" id="check-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Megoldás levezetése</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
        
        <div id="chart-area" class="chart-container" style="display:none;">
            <h3>Hőmérséklet kiegyenlítődés vizualizációja (T - Q diagram)</h3>
            <div id="svg-holder"></div>
        </div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>
<script>
    let appMode = 'gyak', currentCat = 'cat1', currentTaskData = {}, solSeen = false;
    let examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }, examDone = { cat1: false, cat2: false, cat3: false, cat4: false };
    let seconds = 0, timerInterval;

    const c_water = 4.2;
    const materials = {
        'alumínium': { c: 0.9 },
        'réz': { c: 0.39 },
        'vas': { c: 0.46 },
        'ólom': { c: 0.13 }
    };

    const theoryData = {
        cat1: "<b>Különböző anyagok hőkeverése:</b><br>Mivel nincs halmazállapot-változás, a leadott hőmennyiség teljesen megegyezik a felvett hőmennyiséggel: <i>Q_felvett = Q_leadott</i>.<br>Képlet: <i>c₁ · m₁ · (T_k - T₁) = c₂ · m₂ · (T₂ - T_k)</i>.<br>Alumínium fajhője: 0,90 kJ/(kg·°C).",
        cat2: "<b>Keverési egyenlet réz esetén:</b><br>A felírt energiamérleg ugyanaz, csak a réz egyedi fajhőjét alkalmazzuk.<br>Réz fajhője: 0,39 kJ/(kg·°C). Víz fajhője: 4,2 kJ/(kg·°C).",
        cat3: "<b>Vas és víz hőegyensúlya:</b><br>Az egyenlet átrendezése a zárójelek felbontása után: <i>c₁m₁T_k - c₁m₁T₁ = c₂m₂T₂ - c₂m₂T_k</i>, amiből a közös hőmérséklet kifejezve:<br><i>T_k = (c₁m₁T₁ + c₂m₂T₂) / (c₁m₁ + c₂m₂)</i>.<br>Vas fajhője: 0,46 kJ/(kg·°C).",
        cat4: "<b>Véletlenszerű szilárd fém test:</b><br>A rendszer véletlenszerűen választ alumínium, vas, réz vagy ólom közül. A fizikai elv változatlan: <i>Q_fel = Q_le</i>."
    };

    function fmt(x, d = 1) { return Number(x).toLocaleString('hu-HU', { minimumFractionDigits: 0, maximumFractionDigits: d }); }

    function toggleTheory() {
        const box = document.getElementById('theory-text');
        box.innerHTML = theoryData[currentCat];
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        resetExam();
        if(m === 'felel') startTimer(); else stopTimer();
        generateTask();
    }

    function startTimer() { 
        seconds = 0; 
        document.getElementById('exam-timer').style.display = 'block'; 
        clearInterval(timerInterval); 
        timerInterval = setInterval(() => { 
            seconds++; 
            let m = Math.floor(seconds/60).toString().padStart(2,'0'), 
                s = (seconds%60).toString().padStart(2,'0'); 
            document.getElementById('exam-timer').innerText = `${m}:${s}`; 
        }, 1000); 
    }
    
    function stopTimer() { clearInterval(timerInterval); document.getElementById('exam-timer').style.display = 'none'; }
    function resetExam() { examScore = { cat1: 0, cat2: 0, cat3: 0, cat4: 0 }; examDone = { cat1: false, cat2: false, cat3: false, cat4: false }; document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('completed')); document.getElementById('grade-display').style.display = 'none'; }
    function switchCat(cat) { currentCat = cat; document.querySelectorAll('.nav-menu .nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-' + cat).classList.add('active'); if(document.getElementById('theory-text').style.display === 'block') toggleTheory(); generateTask(); }

    function generateTask() {
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('solution-box').style.display = 'none';
        solSeen = false;

        if (appMode === 'felel' && examDone[currentCat]) {
            document.getElementById('exercise-text').innerHTML = "Ezt a szintet a felelés során már teljesítetted.";
            document.getElementById('inputs-container').innerHTML = "";
            document.getElementById('chart-area').style.display = 'none';
            return;
        }

        let m_w = (Math.floor(Math.random() * 8) + 3) * 0.2; 
        m_w = Math.round(m_w * 10) / 10;
        let t_w = Math.floor(Math.random() * 15) + 15;       

        let matName = 'alumínium';
        if (currentCat === 'cat2') matName = 'réz';
        else if (currentCat === 'cat3') matName = 'vas';
        else if (currentCat === 'cat4') {
            const keys = Object.keys(materials);
            matName = keys[Math.floor(Math.random() * keys.length)];
        }

        let m_m = (Math.floor(Math.random() * 10) + 2) * 0.1; 
        m_m = Math.round(m_m * 10) / 10;
        let t_m = Math.floor(Math.random() * 40) + 70;        

        calculateTask(m_w, t_w, matName, m_m, t_m);

        if (appMode === 'gyak') {
            document.getElementById('chart-area').style.display = 'block';
            document.getElementById('sol-btn').style.display = 'inline-block';
            drawChart();
        } else {
            document.getElementById('chart-area').style.display = 'none';
            document.getElementById('sol-btn').style.display = 'none';
        }
    }
    function calculateTask(m_w, t_w, matName, m_m, t_m) {
        let c_m = materials[matName].c;
        let numerator = (c_water * m_w * t_w) + (c_m * m_m * t_m);
        let denominator = (c_water * m_w) + (c_m * m_m);
        let tk = numerator / denominator;
        let q_trans = c_m * m_m * (t_m - tk);

        tk = Math.round(tk * 100) / 100;
        q_trans = Math.round(q_trans * 10) / 10;

        currentTaskData = { m_w: m_w, t_w: t_w, matName: matName, c_m: c_m, m_m: m_m, t_m: t_m, tk: tk, q_trans: q_trans };
        renderUI();
    }

    function renderUI() {
        let d = currentTaskData;
        document.getElementById('exercise-text').innerHTML = `Egy kaloriméterben lévő <b>${fmt(d.m_w)} kg</b> tömegű, <b>${d.t_w} °C</b> hőmérsékletű vízbe belehelyezünk egy <b>${fmt(d.m_m)} kg</b> tömegű, <b>${d.t_m} °C</b>-os <b>${d.matName}</b> tömböt. <br><small>Fajhők: c_víz = 4,2 kJ/(kg·°C); c_${d.matName} = ${d.c_m} kJ/(kg·°C). Halmazállapot-változás nem történik!</small>`;

        let html = `
            <div class="input-row">
                <label>1. A víz által felvett hő mennyisége (Q_fel) [kJ]:</label>
                <span><input type="text" id="input-qfel" placeholder="kJ-ban"> kJ</span>
            </div>
            <div class="input-row">
                <label>2. A fém által leadott hő mennyisége (Q_lead) [kJ]:</label>
                <span><input type="text" id="input-qled" placeholder="kJ-ban"> kJ</span>
            </div>
            <div class="input-row" style="border-top: 2px solid #00796b; padding-top: 10px; font-weight: bold;">
                <label>3. Végső egyensúlyi közös hőmérséklet (T_közös) [°C]:</label>
                <span><input type="text" id="input-tk" placeholder="°C-ban"> °C</span>
            </div>
        `;
        document.getElementById('inputs-container').innerHTML = html;
    }

    function checkAnswers() {
        let allCorrect = true; let d = currentTaskData;
        let uQfel = parseFloat(document.getElementById('input-qfel').value.replace(',', '.'));
        let uQled = parseFloat(document.getElementById('input-qled').value.replace(',', '.'));
        let uTk = parseFloat(document.getElementById('input-tk').value.replace(',', '.'));

        if (Math.abs(uQfel - d.q_trans) < 1.0) document.getElementById('input-qfel').style.borderColor = "#4caf50";
        else { document.getElementById('input-qfel').style.borderColor = "#f44336"; allCorrect = false; }

        if (Math.abs(uQled - d.q_trans) < 1.0) document.getElementById('input-qled').style.borderColor = "#4caf50";
        else { document.getElementById('input-qled').style.borderColor = "#f44336"; allCorrect = false; }

        if (Math.abs(uTk - d.tk) < 0.3) document.getElementById('input-tk').style.borderColor = "#4caf50";
        else { document.getElementById('input-tk').style.borderColor = "#f44336"; allCorrect = false; }

        if (allCorrect) {
            document.getElementById('feedback').innerHTML = "<span style='color:green;'>✓ Kiváló! Minden számítás és a közös hőmérséklet is tökéletes.</span>";
            if(appMode === 'felel') {
                examScore[currentCat] = solSeen ? 0.5 : 1; examDone[currentCat] = true;
                document.getElementById('btn-' + currentCat).classList.add('completed'); checkExamEnd();
            }
        } else { document.getElementById('feedback').innerHTML = "<span style='color:red;'>✗ Hibás érték(ek)et adtál meg a levezetésben!</span>"; }
    }

    function showSolution() {
        solSeen = true; let d = currentTaskData;
        let html = `
            <h4>A kalorimetrikus egyenlet részletes levezetése:</h4>
            <div class="step-box"><b>1. Hőegyenlet:</b> Q_felvett = Q_leadott<br><i>c_víz · m_víz · (T_k - T_víz) = c_fém · m_fém · (T_fém - T_k)</i></div>
            <div class="step-box"><b>2. Behelyettesítés:</b><br>4,2 · ${d.m_w} · (T_k - ${d.t_w}) = ${d.c_m} · ${d.m_m} · (${d.t_m} - T_k)</div>
            <div class="step-box"><b>3. Zárójelek felbontása és rendezés:</b><br>${fmt(4.2 * d.m_w)} · T_k - ${fmt(4.2 * d.m_w * d.t_w)} = ${fmt(d.c_m * d.m_m)} · ${d.t_m} - ${fmt(d.c_m * d.m_m)} · T_k</div>
            <p style='font-size:1.3em; color:#1a237e; text-align:center;'><b>Közös egyensúlyi hőmérséklet: T_közös = ${fmt(d.tk, 2)} °C</b><br>Kicserélődött hőenergia: <b>${fmt(d.q_trans)} kJ</b></p>
        `;
        document.getElementById('solution-box').innerHTML = html; document.getElementById('solution-box').style.display = 'block';
    }

    function checkExamEnd() {
        if(examDone.cat1 && examDone.cat2 && examDone.cat3 && examDone.cat4) {
            stopTimer();
            let totalPoints = examScore.cat1 + examScore.cat2 + examScore.cat3 + examScore.cat4;
            let percent = (totalPoints / 4) * 100;
            let grade = percent >= 85 ? 5 : percent >= 70 ? 4 : percent >= 55 ? 3 : percent >= 40 ? 2 : 1;
            let gBox = document.getElementById('grade-display');
            gBox.innerHTML = `<h2>Felelés lezárva!</h2><h1 style="font-size:3.5em; color:#00796b;">Érdemjegy: ${grade}</h1>`;
            gBox.style.display = 'block';
        }
    }

    function drawChart() {
        const d = currentTaskData; const w = 500, h = 280, padX = 60, padY = 40;
        let svg = `<svg width="${w}" height="${h}" style="background:#fafafa; border:1px solid #ccc;">`;
        let minT = 0, maxT = 120;
        function mapX(q) { return padX + (q / (d.q_trans || 1)) * (w - 2 * padX); }
        function mapY(t) { return h - padY - ((t - minT) / (maxT - minT)) * (h - 2 * padY); }

        for(let t = 20; t <= 100; t += 20) {
            let y = mapY(t);
            svg += `<line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" class="chart-grid" /><text x="${padX - 10}" y="${y + 4}" class="chart-text" text-anchor="end">${t}°C</text>`;
        }

        svg += `<line x1="${padX}" y1="${h-padY}" x2="${w-padX}" y2="${h-padY}" class="chart-axis" /><line x1="${padX}" y1="${h-padY}" x2="${padX}" y2="${padY}" class="chart-axis" />`;
        svg += `<line x1="${mapX(0)}" y1="${mapY(d.t_w)}" x2="${mapX(d.q_trans)}" y2="${mapY(d.tk)}" class="chart-line-solid" />`;
        svg += `<line x1="${mapX(0)}" y1="${mapY(d.t_m)}" x2="${mapX(d.q_trans)}" y2="${mapY(d.tk)}" class="chart-line-dash" />`;
        svg += `<circle cx="${mapX(d.q_trans)}" cy="${mapY(d.tk)}" r="5" class="chart-dot" /><text x="${mapX(d.q_trans)}" y="${mapY(d.tk) - 10}" class="chart-text" font-weight="bold" text-anchor="middle">T_k = ${fmt(d.tk)}°C</text></svg>`;

        document.getElementById('svg-holder').innerHTML = svg;
    }

    generateTask();
</script>
</body>
</html>
