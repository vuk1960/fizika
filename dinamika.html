<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fizika mester - Newton törvényei</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; background: #eceff1; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; background: #cfd8dc; padding: 15px; border-radius: 10px; }
        .mode-btn { padding: 12px 30px; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #1a237e; color: white; transform: scale(1.05); }
        
        .nav-menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #e0e0e0; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 0.9em; }
        .nav-btn.active { background: #2196f3; color: white; }
        .nav-btn.completed { background: #4caf50 !important; color: white; }

        .theory-box { background: #e3f2fd; padding: 15px; border-left: 6px solid #2196f3; border-radius: 6px; margin-bottom: 20px; display: none; line-height: 1.5; }
        .theory-btn { background: #ff9800; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }

        .exercise-area { border: 2px solid #e1e4e8; padding: 25px; border-radius: 10px; background: #fafafa; min-height: 250px; }
        input { padding: 10px; width: 140px; border: 2px solid #ccc; border-radius: 6px; font-size: 1.1em; }
        .action-btn { background: #4caf50; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 5px; }
        .solution { display: none; background: #fffde7; padding: 15px; border-radius: 8px; border: 1px solid #fbc02d; margin-top: 15px; line-height: 1.6; }
        .timer { font-size: 1.5em; font-weight: bold; text-align: right; color: #d32f2f; margin-bottom: 5px; }
        .grade-box { display: none; text-align: center; padding: 30px; border: 5px solid #1a237e; border-radius: 15px; background: #e8eaf6; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div id="exam-timer" class="timer" style="display:none;">00:00</div>
    <h1 style="text-align:center; color: #1a237e;">Dinamika: Newton törvényei</h1>
    <h1 style="text-align:right; color: #1a237e; font-size: 1rem;"> <a href="index.html">← Vissza a kezdő oldalra</a></h1>
   
    <div class="mode-selector">
        <button id="mode-gyak" class="mode-btn active" onclick="setMode('gyak')">Gyakorlás</button>
        <button id="mode-felel" class="mode-btn" onclick="setMode('felel')">Felelés (Jegyre)</button>
    </div>

    <div class="nav-menu">
        <button class="nav-btn active" id="btn-dyn1" onclick="switchCat('dyn1')">I. Tehetetlenség</button>
        <button class="nav-btn" id="btn-dyn2" onclick="switchCat('dyn2')">II. F=m·a</button>
        <button class="nav-btn" id="btn-dyn3" onclick="switchCat('dyn3')">III. Kölcsönhatás</button>
        <button class="nav-btn" id="btn-fric" onclick="switchCat('fric')">Súrlódás</button>
        <button class="nav-btn" id="btn-spring" onclick="switchCat('spring')">Rugó</button>
    </div>

    <button class="theory-btn" onclick="toggleTheory()">📖 Elméleti összefoglaló</button>
    <div id="theory-text" class="theory-box"></div>

    <div class="exercise-area">
        <div id="exercise-text" style="font-size: 1.25em; margin-bottom: 20px; line-height: 1.4;"></div>
        <div id="inputs-container"></div>
        <div id="controls">
            <button class="action-btn" id="check-btn" onclick="checkAnswers()">Ellenőrzés</button>
            <button class="action-btn" style="background:#673ab7" onclick="generateTask()">Új feladat</button>
            <button class="action-btn" style="background:#0288d1" id="sol-btn" onclick="showSolution()">Megoldás levezetése</button>
        </div>
        <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        <div id="solution-box" class="solution"></div>
    </div>
    <div id="grade-display" class="grade-box"></div>
</div>

<script>
    let appMode = 'gyak', currentCat = 'dyn1', currentTasks = [], fullSteps = "", solSeen = false;
    let examScore = { dyn1: 0, dyn2: 0, dyn3: 0, fric: 0, spring: 0 }, examDone = { dyn1: false, dyn2: false, dyn3: false, fric: false, spring: false };
    let seconds = 0, timerInterval;

    const theoryData = {
        dyn1: "<b>Newton I. törvénye:</b> Ha a testre ható erők eredője nulla, a test nyugalomban marad vagy egyenes vonalú egyenletes mozgást végez.",
        dyn2: "<b>Newton II. törvénye:</b> F = m · a. A gyorsulást az eredő erő (ΣF) hozza létre.",
        dyn3: "<b>Newton III. törvénye:</b> Hatás-ellenhatás. Az erők párosával lépnek fel, egyenlő nagyságúak és ellentétesek.",
        fric: "<b>Súrlódás és mozgás:</b> Vízszintes talajon a gyorsulást a húzóerő (F) és a súrlódási erő (F<sub>s</sub>) különbsége határozza meg:<br><b>m · a = F - (µ · m · g)</b>",
        spring: "<b>Rugalmas erő:</b> <b>F = D · Δx</b>. D: rugóállandó [N/m], Δx: megnyúlás [m]."
    };

    function toggleTheory() {
        const box = document.getElementById('theory-text');
        box.innerHTML = theoryData[currentCat];
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function setMode(m) {
        appMode = m;
        document.getElementById('mode-gyak').className = 'mode-btn' + (m === 'gyak' ? ' active' : '');
        document.getElementById('mode-felel').className = 'mode-btn' + (m === 'felel' ? ' active' : '');
        resetExam();
        if(m === 'felel') startTimer(); else stopTimer();
        generateTask();
    }

    function startTimer() { seconds = 0; document.getElementById('exam-timer').style.display = 'block'; clearInterval(timerInterval); timerInterval = setInterval(() => { seconds++; let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0'); document.getElementById('exam-timer').innerText = `${m}:${s}`; }, 1000); }
    function stopTimer() { clearInterval(timerInterval); document.getElementById('exam-timer').style.display = 'none'; }
    
    function resetExam() { 
        examScore = { dyn1: 0, dyn2: 0, dyn3: 0, fric: 0, spring: 0 }; 
        examDone = { dyn1: false, dyn2: false, dyn3: false, fric: false, spring: false }; 
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('completed')); 
        document.getElementById('grade-display').style.display = 'none'; 
    }

    function switchCat(cat) { 
        currentCat = cat; 
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); 
        document.getElementById('btn-' + cat).classList.add('active'); 
        generateTask(); 
    }

    function generateTask() {
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('solution-box').style.display = 'none';
        document.getElementById('check-btn').disabled = false;
        solSeen = false;
        
        if(currentCat === 'dyn1') genDyn1();
        else if(currentCat === 'dyn2') genDyn2();
        else if(currentCat === 'dyn3') genDyn3();
        else if(currentCat === 'fric') genFric();
        else if(currentCat === 'spring') genSpring();
        
        renderInputs();
    }

    function renderInputs() { 
        document.getElementById('inputs-container').innerHTML = currentTasks.map((t, i) => 
            `<div style="margin:10px 0;">${t.label}: <input type="number" step="any" id="ans-${i}"> ${t.unit}</div>`
        ).join('');
    }

    function genDyn1() {
        const f1 = Math.floor(Math.random() * 50) + 10;
        document.getElementById('exercise-text').innerHTML = `Egy testre balra ${f1} N erő hat. Mekkora erőnek kell hatnia jobbra, hogy a test nyugalomban maradjon?`;
        currentTasks = [{ label: "Erő", unit: "N", ans: f1 }];
        fullSteps = `ΣF = 0 feltétel miatt a két erőnek egyenlőnek kell lennie.`;
    }

    function genDyn2() {
        const m = Math.floor(Math.random() * 10) + 2, a = Math.floor(Math.random() * 5) + 1;
        document.getElementById('exercise-text').innerHTML = `Mekkora erő szükséges egy ${m} kg tömegű test ${a} m/s² gyorsításához?`;
        currentTasks = [{ label: "Erő (F)", unit: "N", ans: m * a }];
        fullSteps = `F = m · a = ${m} · ${a} = ${m*a} N.`;
    }

    function genDyn3() {
        const f = Math.floor(Math.random() * 100) + 20;
        document.getElementById('exercise-text').innerHTML = `Egy "A" test ${f} N erővel nyomja a "B" testet. Mekkora erővel hat a "B" test az "A" testre?`;
        currentTasks = [{ label: "Erő", unit: "N", ans: f }];
        fullSteps = `Newton III. törvénye: hatás = ellenhatás.`;
    }

    function genFric() {
        const variant = Math.floor(Math.random() * 3);
        const m = Math.floor(Math.random() * 10) + 5; // 5-15 kg
        const mu = parseFloat((Math.random() * 0.3 + 0.1).toFixed(2)); // 0.1 - 0.4
        const fs = m * 10 * mu;

        if (variant === 0) { // a-t keressük
            const f_huz = Math.floor(fs + (Math.random() * 20 + 5));
            const a = (f_huz - fs) / m;
            document.getElementById('exercise-text').innerHTML = `Egy ${m} kg tömegű testet F = ${f_huz} N erővel húzunk vízszintesen. A súrlódási együttható µ = ${mu}. Mekkora a test gyorsulása? (g = 10 m/s²)`;
            currentTasks = [{ label: "Gyorsulás (a)", unit: "m/s²", ans: parseFloat(a.toFixed(2)) }];
            fullSteps = `1. Súrlódási erő: F<sub>s</sub> = µ·m·g = ${mu}·${m}·10 = ${fs} N<br>2. Eredő erő: F<sub>e</sub> = F - F<sub>s</sub> = ${f_huz} - ${fs} = ${f_huz-fs} N<br>3. Gyorsulás: a = F<sub>e</sub> / m = ${f_huz-fs} / ${m} = ${a.toFixed(2)} m/s²`;
        } else if (variant === 1) { // F-et keressük
            const a = Math.floor(Math.random() * 4) + 1;
            const f_huz = (m * a) + fs;
            document.getElementById('exercise-text').innerHTML = `Mekkora F erővel kell húznunk egy ${m} kg tömegű testet, hogy a gyorsulása ${a} m/s² legyen? A súrlódási együttható µ = ${mu}. (g = 10 m/s²)`;
            currentTasks = [{ label: "Húzóerő (F)", unit: "N", ans: parseFloat(f_huz.toFixed(2)) }];
            fullSteps = `1. Súrlódási erő: F<sub>s</sub> = µ·m·g = ${mu}·${m}·10 = ${fs} N<br>2. Szükséges eredő erő: F<sub>e</sub> = m·a = ${m}·${a} = ${m*a} N<br>3. Húzóerő: F = F<sub>e</sub> + F<sub>s</sub> = ${m*a} + ${fs} = ${f_huz} N`;
        } else { // mu-t keressük
            const a = Math.floor(Math.random() * 3) + 1;
            const f_huz = Math.floor((m * a) + (m * 10 * 0.5)); // generálunk egy húzóerőt
            const mu_val = (f_huz - m * a) / (m * 10);
            document.getElementById('exercise-text').innerHTML = `Egy ${m} kg tömegű testet F = ${f_huz} N erővel húzunk, és azt tapasztaljuk, hogy a gyorsulása ${a} m/s². Mekkora a súrlódási együttható (µ)?`;
            currentTasks = [{ label: "Együttható (µ)", unit: "", ans: parseFloat(mu_val.toFixed(2)) }];
            fullSteps = `1. Eredő erő: F<sub>e</sub> = m·a = ${m}·${a} = ${m*a} N<br>2. Súrlódási erő: F<sub>s</sub> = F - F<sub>e</sub> = ${f_huz} - ${m*a} = ${f_huz - m*a} N<br>3. µ = F<sub>s</sub> / (m·g) = ${f_huz - m*a} / (${m}·10) = ${mu_val.toFixed(2)}`;
        }
    }

    function genSpring() {
        const type = Math.floor(Math.random() * 3);
        if (type === 0) { // F
            const D = (Math.floor(Math.random() * 10) + 1) * 50, dx = (Math.floor(Math.random() * 20) + 5) / 100;
            document.getElementById('exercise-text').innerHTML = `Rugóállandó D = ${D} N/m, megnyúlás Δx = ${dx} m. Mekkora a rugalmas erő?`;
            currentTasks = [{ label: "Erő (F)", unit: "N", ans: D * dx }];
            fullSteps = `F = D · Δx = ${D} · ${dx} = ${D*dx} N.`;
        } else if (type === 1) { // D
            const F = Math.floor(Math.random() * 80) + 10, dx = (Math.floor(Math.random() * 10) + 2) / 100;
            document.getElementById('exercise-text').innerHTML = `F = ${F} N erő hatására a rugó Δx = ${dx} m-t nyúlik meg. Mekkora D?`;
            currentTasks = [{ label: "Rugóállandó (D)", unit: "N/m", ans: parseFloat((F / dx).toFixed(1)) }];
            fullSteps = `D = F / Δx = ${F} / ${dx} = ${(F/dx).toFixed(1)} N/m.`;
        } else { // dx
            const F = Math.floor(Math.random() * 60) + 10, D = (Math.floor(Math.random() * 5) + 1) * 100;
            document.getElementById('exercise-text').innerHTML = `D = ${D} N/m rugót F = ${F} N erővel húzzuk. Mekkora a megnyúlás?`;
            currentTasks = [{ label: "Megnyúlás (Δx)", unit: "m", ans: parseFloat((F / D).toFixed(3)) }];
            fullSteps = `Δx = F / D = ${F} / ${D} = ${(F/D).toFixed(3)} m.`;
        }
    }

    function checkAnswers() {
        let allCorrect = true;
        currentTasks.forEach((t, i) => {
            const val = parseFloat(document.getElementById(`ans-${i}`).value);
            if (isNaN(val) || Math.abs(val - t.ans) > 0.02) allCorrect = false;
        });

        const feedback = document.getElementById('feedback');
        if (allCorrect) {
            feedback.innerHTML = "✅ Helyes!"; feedback.style.color = "#4caf50";
            if (appMode === 'felel' && !examDone[currentCat]) {
                examScore[currentCat] = solSeen ? 0 : 1;
                examDone[currentCat] = true;
                document.getElementById('btn-' + currentCat).classList.add('completed');
                checkExamEnd();
            }
        } else {
            feedback.innerHTML = "❌ Nem jó, próbáld újra!"; feedback.style.color = "#f44336";
        }
    }

    function showSolution() {
        solSeen = true;
        const box = document.getElementById('solution-box');
        box.innerHTML = `<b>Megoldás:</b><br>${fullSteps}`;
        box.style.display = 'block';
    }

    function checkExamEnd() {
        if (Object.values(examDone).every(v => v === true)) {
            stopTimer();
            const total = Object.values(examScore).reduce((a, b) => a + b, 0);
            const display = document.getElementById('grade-display');
            display.style.display = 'block';
            display.innerHTML = `<h2>Felelés vége!</h2><p>Pontszám: 5/${total}</p><h1>Jegy: ${total === 5 ? 5 : total === 4 ? 4 : total === 3 ? 3 : total === 2 ? 2 : 1}</h1>`;
        }
    }
</script>
</body>
</html>
